name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      server: ${{ steps.filter.outputs.server }}
      agent: ${{ steps.filter.outputs.agent }}
      web: ${{ steps.filter.outputs.web }}
      deploy: ${{ steps.filter.outputs.deploy }}
      npm: ${{ steps.filter.outputs.npm }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            server:
              - 'server/**'
              - 'agent/**'          # the integration tests run the fake agent image
              - 'docs/openapi.yaml'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - 'docs/openapi.yaml' # web/src/api/schema.ts is generated from it
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            npm:
              - 'npm/**'
              - 'server/**'
              - 'web/**'
              - 'agent/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release.yml'

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fleetpocket
          POSTGRES_PASSWORD: fleetpocket
          POSTGRES_DB: fleetpocket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleetpocket"
          --health-interval 2s
          --health-retries 30
    env:
      FLEETPOCKET_TEST_DATABASE_URL: postgres://fleetpocket:fleetpocket@localhost:5432/fleetpocket?sslmode=disable
      FLEETPOCKET_TEST_RUNNER_IMAGE: fleetpocket-agent:ci
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install gitleaks
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - uses: docker/setup-buildx-action@v4
      - name: Build the agent image for integration tests
        uses: docker/build-push-action@v7
        with:
          context: agent
          load: true
          tags: fleetpocket-agent:ci
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent
      - run: go vet ./...
      # -p 1: Docker integration tests must not run concurrently (see server/README.md).
      - run: go test -p 1 -count=1 ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: server

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API types match docs/openapi.yaml
        run: npm run check:api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Bundle budgets (SPEC-web section 7)
        run: npm run check:size
      - name: Playwright smoke tests (mock mode)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

  deploy-files:
    needs: changes
    if: needs.changes.outputs.deploy == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compose files are valid
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.deploy.yml config -q
          docker compose -f deploy/docker-compose.dev.yml config -q
      - name: Caddyfile is valid
        run: >-
          docker run --rm -e FLEETPOCKET_DOMAIN=fleetpocket.example.com
          -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  npm-smoke:
    # Dry run of the npm release (npm/smoke.sh): pack every package, install
    # the tarballs, --version, then on Linux start (fake runner), add a temp
    # repository, run a task to branch_ready, check the jm/... branch, stop.
    # macOS runners have no Docker: there it stops after --version and doctor.
    needs: changes
    if: needs.changes.outputs.npm == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Launcher tests
        run: cd npm/jungle-monkey && npm test
      - name: Web app
        run: cd web && npm ci && cd .. && make embed-web
      - name: Agent image
        if: runner.os == 'Linux'
        run: docker build -q -t fleetpocket-agent:dev agent
      - name: Smoke test
        env:
          SMOKE_DOCKER: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: ./npm/smoke.sh

  links:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md index.html 'docs/**/*.md'
          fail: true
