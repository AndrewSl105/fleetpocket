name: pages

# The landing page: index.html plus the brand assets it references.
# Settings → Pages → Source must be "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - index.html
      - docs/brand/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage the site
        run: |
          mkdir -p _site/docs
          cp index.html _site/
          cp -r docs/brand _site/docs/brand
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
