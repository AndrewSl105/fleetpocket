openapi: 3.1.0
info:
  title: Fleetpocket API
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  version: 0.1.0
  description: |
    REST API of Fleetpocket. See docs/API.md for behaviour, the task state
    machine, timeline event types and the WebSocket protocol.
    Every non-GET request must send `X-Requested-With: fleetpocket`.

    Team mode (off by default, docs/SPEC-server.md "Teams"): every session
    route needs a role. Viewers read; members also create tasks, schedules and
    ideas and act on their own; admins do everything. A refused role is
    `403 forbidden`. In single-owner mode every route works as before.
servers:
  - url: /
security:
  - session: []
  - telegramBearer: []
tags:
  - name: setup
  - name: auth
  - name: projects
  - name: tasks
  - name: nodes
  - name: system
  - name: settings
  - name: schedules
  - name: ideas
  - name: team

paths:
  /api/v1/setup/status:
    get:
      operationId: setupStatus
      tags: [setup]
      summary: Whether the first-run setup wizard is needed
      security: []
      responses:
        '200':
          description: Setup state
          content:
            application/json:
              schema:
                type: object
                required: [setup_required, github_configured]
                properties:
                  setup_required: { type: boolean, description: No owner exists; every other API route answers 409 setup_required }
                  github_configured: { type: boolean }
                  team_enabled: { type: boolean, description: 'Team mode is on: the login screen asks for an email (empty: the break-glass owner login)' }

  /api/v1/setup/owner:
    post:
      operationId: setupOwner
      tags: [setup]
      summary: Set the owner password and get a new TOTP secret (setup mode only)
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, password]
              additionalProperties: false
              properties:
                code: { type: string, description: One-time setup code from the server log }
                password: { type: string, minLength: 12 }
      responses:
        '200':
          description: Pending owner; confirm it with a TOTP code
          content:
            application/json:
              schema:
                type: object
                required: [otpauth_uri, secret]
                properties:
                  otpauth_uri: { type: string, description: 'otpauth://totp/... for the QR code' }
                  secret: { type: string, description: Base32 secret for manual entry }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/setup/owner/confirm:
    post:
      operationId: setupOwnerConfirm
      tags: [setup]
      summary: Confirm the first TOTP code, save the owner and leave setup mode
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, totp]
              additionalProperties: false
              properties:
                code: { type: string, description: One-time setup code from the server log }
                totp: { type: string, description: Current 6-digit code }
      responses:
        '200':
          description: Owner saved; logged in (sets the fleetpocket_session cookie)
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/setup/github/manifest:
    post:
      operationId: setupGitHubManifest
      tags: [setup]
      summary: Start creating the GitHub App from a manifest
      description: POST `manifest` (as JSON text) in an HTML form to `action_url`; its `state` is bound to this session for one hour.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                organization: { type: string, description: 'Create the App on this organization; omitted or empty: the personal account' }
      responses:
        '200':
          description: Form target and manifest
          content:
            application/json:
              schema:
                type: object
                required: [action_url, manifest]
                properties:
                  action_url: { type: string }
                  manifest: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/setup/github/callback:
    get:
      operationId: setupGitHubCallback
      tags: [setup]
      summary: GitHub's redirect after the App was created (browser navigation)
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '303':
          description: To the App's installation page on success, else to `/setup?step=github&github_error=state|configured|conversion|key|save`
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with password and TOTP
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, totp]
              additionalProperties: false
              properties:
                password: { type: string }
                totp: { type: string, description: Current 6-digit code }
                email:
                  type: string
                  description: |
                    Team mode: the user's email. Without it, the owner credentials
                    (ADMIN_PASSWORD_HASH/ADMIN_TOTP_SECRET or the setup wizard's) sign in
                    as user #1, the break-glass admin.
      responses:
        '200':
          description: Logged in; sets the fleetpocket_session cookie
          headers:
            Set-Cookie: { schema: { type: string } }
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/auth/telegram:
    post:
      operationId: loginTelegram
      tags: [auth]
      summary: Log in from the Telegram Mini App
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [init_data]
              additionalProperties: false
              properties:
                init_data: { type: string, description: Telegram.WebApp.initData verbatim }
      responses:
        '200':
          description: |
            Logged in; sets the fleetpocket_session cookie and also returns the session as `token`.
            Telegram Web embeds the Mini App in a cross-site iframe where the SameSite=Lax cookie
            is not sent: keep `token` in memory (never in storage) and send it as
            `Authorization: Bearer <token>`; open the WebSocket with a ticket (`POST /api/v1/ws/ticket`).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SessionInfo'
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: 'Session token for `Authorization: Bearer` (Telegram sessions only)' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /api/v1/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Session check
      responses:
        '200':
          description: Session is valid
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } }
        '401': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      tags: [team]
      summary: Change my profile or password (team mode)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                email: { type: string, format: email }
                github_login: { type: string, description: '"" clears' }
                commit_email: { type: string, description: 'Adds Co-authored-by to commits made for you; "" clears' }
                task_scope: { type: string, enum: [mine, everyone], description: Default of the Mine | Everyone filters }
                current_password: { type: string }
                new_password: { type: string, minLength: 12, description: Needs current_password; signs out your other sessions }
      responses:
        '200': { description: Me, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor from the previous page }
      responses:
        '200':
          description: A page of projects
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  next_cursor: { type: string }
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [id]
                  properties:
                    id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,39}$' }
                - $ref: '#/components/schemas/ProjectFields'
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      responses:
        '200':
          description: The project
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      description: Omitted fields are unchanged; "" or 0 resets an override to the server default.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProjectFields' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: archiveProject
      tags: [projects]
      summary: Archive a project
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Archived
          content: { application/json: { schema: { $ref: '#/components/schemas/Project' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/repositories:
    post:
      operationId: addRepository
      tags: [projects]
      summary: Add a repository to a project
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [full_name, installation_id]
                  additionalProperties: false
                  properties:
                    full_name: { type: string, example: andrewsl105/vatary-server }
                    installation_id: { type: integer, format: int64 }
                    base_branch: { allOf: [{ $ref: '#/components/schemas/BranchName' }], default: dev }
                    is_default: { type: boolean, default: false }
                    source: { type: string, enum: [github] }
                - type: object
                  description: 'A local repository (local mode only; `400 local_mode_only` otherwise). Same as `POST /local/repos` with this project'
                  required: [source, path]
                  additionalProperties: false
                  properties:
                    source: { type: string, enum: [local] }
                    path: { type: string, description: Absolute path of the work tree }
      responses:
        '201':
          description: Added
          content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } }
        '200':
          description: 'Local repository that was already added (idempotent)'
          content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } }
        '400': { description: '`invalid`, or `local_mode_only` for a local repository in server mode', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/repositories/{repoId}:
    patch:
      operationId: updateRepository
      tags: [projects]
      summary: Update a repository's base branch or default flag
      description: |
        Omitted fields are unchanged. `is_default: true` clears the flag on the
        project's other repositories; `is_default: false` on the current default
        is 409 `conflict`. Changing `base_branch` is 409 `in_use` while tasks
        that are not completed/failed/cancelled use the repository.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                base_branch: { $ref: '#/components/schemas/BranchName' }
                is_default: { type: boolean }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteRepository
      tags: [projects]
      summary: Remove a repository
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/github/repositories:
    get:
      operationId: listGitHubRepositories
      tags: [projects]
      summary: Repositories the GitHub App can see
      responses:
        '200':
          description: Repositories
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GitHubRepo' } }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/schedules:
    get:
      operationId: listSchedules
      tags: [schedules]
      summary: List schedules
      description: By name, each with its month-to-date spend, whether a task of it is still running, and its latest firing.
      responses:
        '200':
          description: All schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
    post:
      operationId: createSchedule
      tags: [schedules]
      summary: Create a schedule
      description: 400 for a bad cron expression, time zone, concurrency, loop, agent, or a repository of another project.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getSchedule
      tags: [schedules]
      summary: One schedule
      responses:
        '200':
          description: The schedule
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateSchedule
      tags: [schedules]
      summary: Replace a schedule
      description: Fields left out take their defaults. The next run is computed again from now.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleInput' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSchedule
      tags: [schedules]
      summary: Delete a schedule (its tasks stay, with schedule_id null)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}/enable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: enableSchedule
      tags: [schedules]
      summary: Resume a schedule
      description: The next run is the first firing after now; firings while it was paused are not made up.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: The schedule
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}/disable:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: disableSchedule
      tags: [schedules]
      summary: Pause a schedule (next_run_at becomes null)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: The schedule
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}/run:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: runSchedule
      tags: [schedules]
      summary: Fire the schedule now (also when paused)
      description: Applies the concurrency policy like a timed firing; the result's `outcome` says whether a task started (`task_id`), the firing waits (`queued`) or was `skipped`.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '201':
          description: The firing
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleFiring' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}/duplicate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: duplicateSchedule
      tags: [schedules]
      summary: Copy a schedule as "<name> (copy)", paused
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '201':
          description: The copy
          content: { application/json: { schema: { $ref: '#/components/schemas/Schedule' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/schedules/{id}/firings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: listScheduleFirings
      tags: [schedules]
      summary: The schedule's history, newest first
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        '200':
          description: Firings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ScheduleFiring' } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List skills
      responses:
        '200':
          description: All skills by slug
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Skill' } }
    post:
      operationId: createSkill
      tags: [skills]
      summary: Create a skill
      description: 400 for bad paths, limits, frontmatter or a secrets-scan finding; 409 when the slug is taken.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillInput' } } }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/skills/import:
    post:
      operationId: importSkill
      tags: [skills]
      summary: Import a SKILL.md or a .zip of a skill folder
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              additionalProperties: false
              properties:
                file: { type: string, format: binary, description: 'SKILL.md, or a .zip (name ends in .zip) with SKILL.md at the root or in one folder; at most 2 MB' }
                slug: { type: string, description: 'Defaults to the zip''s folder name, else the frontmatter name' }
      responses:
        '201':
          description: Imported
          content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/skills/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getSkill
      tags: [skills]
      summary: Get a skill
      responses:
        '200':
          description: The skill
          content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateSkill
      tags: [skills]
      summary: Replace a skill
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkillInput' } } }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Delete a skill (also from every project)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/skills/{id}/duplicate:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      operationId: duplicateSkill
      tags: [skills]
      summary: Copy a skill under `<slug>-copy` (or `<slug>-copy-N`), not enabled by default
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '201':
          description: The copy
          content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/skills/{id}/export:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: exportSkill
      tags: [skills]
      summary: Download the skill folder as `<slug>.zip`
      responses:
        '200':
          description: Zip with `<slug>/SKILL.md` and the extra files
          content: { application/zip: { schema: { type: string, format: binary } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks, newest first
      parameters:
        - { name: project, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string }, description: Comma-separated statuses }
        - { name: created_by, in: query, schema: { type: string }, description: 'Team mode: `me` or a user id (the Mine and person filters)' }
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of tasks
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Task' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      description: |
        JSON, or `multipart/form-data` with the same fields plus files (images or
        any other file) in `files[]`. The attachments are listed in the task's `created` event.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, prompt]
              additionalProperties: false
              properties:
                project_id: { type: string }
                repository_id: { type: integer, format: int64, description: Defaults to the project's default repository }
                title: { type: string, description: Defaults to the first line of the prompt }
                prompt: { type: string }
                agent: { $ref: '#/components/schemas/Agent', description: "Defaults to the project's agent; 400 when the agent has no credentials on the task's host" }
                node: { type: string, description: "Where the task runs: `server` or a node id. Defaults to the project's host; 400 when the node is unknown or lacks the agent's credentials" }
                output: { $ref: '#/components/schemas/TaskOutput', description: "Defaults to the project's default_output, else `pr`. `artifacts` and `pr_and_artifacts` are refused with 400 until diagram collection ships" }
                skills_add: { type: array, items: { type: string }, description: Skill slugs added to the project's skills for this task }
                skills_remove: { type: array, items: { type: string }, description: Skill slugs removed from the project's skills for this task }
                loop: { $ref: '#/components/schemas/LoopInput' }
                start_from: { $ref: '#/components/schemas/StartFrom', description: '`working_tree` only for local repositories (400 otherwise); default `last_commit`' }
                idea_id: { type: integer, format: int64, description: 'An Ideas board card the task starts from: it is linked and moved to In progress (an `idea` event). 400 for an unknown idea, 409 when the board is off or the idea is archived' }
          multipart/form-data:
            schema:
              type: object
              required: [project_id, prompt]
              additionalProperties: false
              properties:
                project_id: { type: string }
                repository_id: { type: integer, format: int64, description: Defaults to the project's default repository }
                title: { type: string, description: Defaults to the first line of the prompt }
                prompt: { type: string }
                agent: { $ref: '#/components/schemas/Agent', description: "Defaults to the project's agent; 400 when the agent has no credentials on the task's host" }
                node: { type: string, description: "Where the task runs: `server` or a node id. Defaults to the project's host; 400 when the node is unknown or lacks the agent's credentials" }
                output: { $ref: '#/components/schemas/TaskOutput' }
                skills_add: { type: string, description: Comma-separated skill slugs }
                skills_remove: { type: string, description: Comma-separated skill slugs }
                loop: { type: string, description: 'LoopInput as JSON' }
                start_from: { $ref: '#/components/schemas/StartFrom' }
                idea_id: { type: integer, format: int64 }
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                  description: PNG, JPEG, WebP or GIF (not animated), at most 40 MB each, 100 MB together; type detected from the content
      responses:
        '201':
          description: Queued
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Task with latest run, open question and PR info
      parameters: [{ $ref: '#/components/parameters/TaskID' }]
      responses:
        '200':
          description: The task
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/events:
    get:
      operationId: listTaskEvents
      tags: [tasks]
      summary: Task timeline, oldest first (or newest first with before_id)
      description: |
        Forward (default): events after `after_id`, oldest first.
        Backward: events before `before_id`, newest first; `before_id=0`
        starts at the newest event. In backward mode pass `next_cursor` back
        as `before_id`. `before_id` cannot be combined with `after_id`/`cursor` (400).
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: after_id, in: query, schema: { type: integer, format: int64 }, description: Last event id the client has }
        - { name: cursor, in: query, schema: { type: string }, description: Alias of after_id }
        - { name: before_id, in: query, schema: { type: integer, format: int64, minimum: 0 }, description: 'Page backwards from this id (exclusive), newest first; 0 = from the newest event' }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of events
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/runs:
    get:
      operationId: listTaskRuns
      tags: [tasks]
      summary: Runs of a task, oldest first (including a queued run)
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string }, description: next_cursor from the previous page }
      responses:
        '200':
          description: A page of runs
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Run' } }
                  next_cursor: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/diff:
    get:
      operationId: getTaskDiff
      tags: [tasks]
      summary: git diff base...branch from the workspace (max 1 MB)
      parameters: [{ $ref: '#/components/parameters/TaskID' }]
      responses:
        '200':
          description: The diff
          content:
            application/json:
              schema:
                type: object
                required: [diff, truncated, base, branch]
                properties:
                  diff: { type: string }
                  truncated: { type: boolean }
                  base: { type: string }
                  branch: { type: string }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/attachments/{attachmentId}:
    get:
      operationId: getAttachment
      tags: [tasks]
      summary: Download an attachment (owner only)
      description: |
        The cleaned image as stored (metadata removed), or with `thumb=1` a JPEG
        whose longest side is at most 480 px. Other files are served as uploaded,
        as `application/octet-stream` with `Content-Disposition: attachment`;
        they have no thumbnail (`thumb=1` is `404`). `410 gone` once the
        attachment was removed (the task completed, or workspace retention ran).
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: thumb, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: The image or file
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/answer:
    post:
      operationId: answerQuestion
      tags: [tasks]
      summary: Answer the open question (first answer wins)
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, text]
              additionalProperties: false
              properties:
                question_id: { type: string }
                text: { type: string }
      responses:
        '200':
          description: Answer accepted
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/message:
    post:
      operationId: sendMessage
      tags: [tasks]
      summary: Follow-up message (queued while a run is active)
      description: |
        `queued`/`preparing`/`running`/`waiting_input`/`pushing`: the text is queued
        (`queued_message` on the task, event `message` with `delivery: queued`) and
        starts the next run when the current one ends. `paused`/`pr_open`/`branch_ready`/`completed`:
        starts a new run now (`delivery: new_run`). Otherwise `409`.
        JSON, or `multipart/form-data` with `text` plus files in `files[]`;
        the attachments are listed in the `message` event and reach the run that
        handles the text.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
          multipart/form-data:
            schema:
              type: object
              required: [text]
              additionalProperties: false
              properties:
                text: { type: string }
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
                  description: PNG, JPEG, WebP or GIF (not animated), at most 40 MB each, 100 MB together; type detected from the content
      responses:
        '200':
          description: Queued, or a new run was started
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/interrupt:
    post:
      operationId: interruptTask
      tags: [tasks]
      summary: Stop the current turn, keep the session
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Interrupted, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/cancel:
    post:
      operationId: cancelTask
      tags: [tasks]
      summary: Cancel the task
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/retry:
    post:
      operationId: retryTask
      tags: [tasks]
      summary: Queue a failed or cancelled task again
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/merge:
    post:
      operationId: mergeTask
      tags: [tasks]
      summary: Squash-merge the PR of a pr_open task, delete its branch and complete the task
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Merged; the task is completed, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: 'Not pr_open (`conflict`), or GitHub refused the merge (`not_mergeable`; the message says why)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/branch/merge:
    post:
      operationId: branchMerge
      tags: [local]
      summary: Merge the delivered branch into the current branch of the local repository
      description: 'Fast-forward when possible, else a merge commit; completes the task ("branch merged into <branch>") and records `branch_action {merged}`. `409`: `dirty` (uncommitted changes to tracked files), `detached` (no current branch), `current_branch`, `merge_conflict` (aborted; `files` lists the conflicts), `git_refused` (e.g. untracked files would be overwritten; nothing changed), `branch_gone`, `repo_missing`, or `conflict` when the task is not `branch_ready`'
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: The task view, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/branch/checkout:
    post:
      operationId: branchCheckout
      tags: [local]
      summary: Check out the delivered branch in the local repository
      description: 'The task stays `branch_ready`; records `branch_action {checked_out}`. `409`: `dirty`, `git_refused`, `branch_gone`, `repo_missing`, `conflict`'
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: The task view, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/branch/discard:
    post:
      operationId: branchDiscard
      tags: [local]
      summary: Delete the delivered branch and complete the task
      description: 'Records `branch_action {discarded}` and sets `local_branch` to null. `409`: `current_branch` (check out another branch first), `repo_missing`, `conflict`'
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: The task view, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/branch/push:
    post:
      operationId: branchPush
      tags: [local]
      summary: Push the task branch to GitHub and open a PR
      description: 'Needs a GitHub `origin` remote (`400 no_github_remote` otherwise) and GitHub connected in local mode (`503 github_disabled` otherwise). Pushes `agent/<id>-<slug>` with the owners token from the server process, opens the PR and moves the task to `pr_open` (normal PR/CI flow, including CI auto-fix). On failure the task returns to `branch_ready` with the reason'
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: The task view, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/local/repos/suggestions:
    get:
      operationId: localRepoSuggestions
      tags: [local]
      summary: Git work trees found on this computer (local mode)
      description: 'Scans ~/code, ~/Projects, ~/projects, ~/dev, ~/src, ~/repos, ~/Documents/GitHub, ~/work and the directory the CLI was started in, 3 levels deep, skipping node_modules, hidden folders and symlink loops. At most 200 results within 2 s, newest commit first; cached for 60 s. `400 local_mode_only` in server mode'
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                required: [items, start]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LocalRepoSuggestion' } }
                  start: { type: [string, 'null'], description: 'The repository the CLI was started in, when it is one ("this folder")' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/local/fs:
    get:
      operationId: localBrowse
      tags: [local]
      summary: Folder browser limited to the home directory (local mode)
      description: 'Lists the subfolders (no files, no hidden folders) of `path` (default: the home directory) and marks git repositories. The resolved path must stay inside the home directory: `403 outside_home` otherwise; symlinks that lead out of it are not listed'
      parameters:
        - { name: path, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Listing, content: { application/json: { schema: { $ref: '#/components/schemas/FolderListing' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/local/repos:
    post:
      operationId: addLocalRepo
      tags: [local]
      summary: Add a folder as a local repository (local mode)
      description: 'The folder must be the top of a non-bare git work tree with at least one commit, outside the Jungle Monkey data directory. Without `project_id` a project named after the folder is created (id: its slug, `-2`… when taken). Idempotent: an added folder returns its repository (`200`, `created: false`). Also accepts the CLI''s control token (`Authorization: Bearer`) for `jungle-monkey add`'
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              additionalProperties: false
              properties:
                path: { type: string, description: Absolute path }
                project_id: { type: string, description: Attach to this project instead of creating one }
      responses:
        '201': { description: Added, content: { application/json: { schema: { $ref: '#/components/schemas/LocalRepoAdded' } } } }
        '200': { description: Already added, content: { application/json: { schema: { $ref: '#/components/schemas/LocalRepoAdded' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/local/repos/{repoId}/status:
    get:
      operationId: localRepoStatus
      tags: [local]
      summary: Branch and dirty state of a local repository's folder
      parameters:
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/LocalRepoStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/local/repos/{repoId}/locate:
    post:
      operationId: locateLocalRepo
      tags: [local]
      summary: Point a local repository at its folder after it was moved ("Locate…")
      description: 'Deliveries that waited for the folder (`pushing`, reason "repository folder not found") resume'
      parameters:
        - { name: repoId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [path], additionalProperties: false, properties: { path: { type: string } } }
      responses:
        '200': { description: The repository, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/local/github:
    get:
      operationId: localGitHubStatus
      tags: [local]
      summary: GitHub connection in local mode (optional; for Push & open PR)
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubConnStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      operationId: localGitHubDisconnect
      tags: [local]
      summary: Forget the stored GitHub token
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubConnStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/local/github/device:
    post:
      operationId: localGitHubDeviceStart
      tags: [local]
      summary: Start the OAuth device flow (scope `repo`)
      description: 'POST https://github.com/login/device/code with the Jungle Monkey OAuth App client id. The owner opens `verification_uri` and enters `user_code`, then the client polls `/local/github/device/poll` every `interval` seconds. `502 github` when GitHub refuses or no client id is configured'
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Device code, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCode' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/local/github/device/poll:
    post:
      operationId: localGitHubDevicePoll
      tags: [local]
      summary: Ask GitHub once whether the owner authorized the device
      description: 'Respects the interval (slow_down adds 5 s); `connected` stores the token in the OS keychain'
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200':
          description: Poll result
          content:
            application/json:
              schema:
                type: object
                required: [status, github]
                properties:
                  status: { type: string, enum: [pending, connected, expired, denied, none] }
                  github: { $ref: '#/components/schemas/GitHubConnStatus' }
        '400': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/v1/local/github/gh:
    post:
      operationId: localGitHubImportGH
      tags: [local]
      summary: Use the GitHub CLI's token (`gh auth token`)
      description: The web app asks the owner first. `400 invalid` when gh is missing or not logged in, or GitHub rejects the token
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubConnStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/local/github/token:
    post:
      operationId: localGitHubSetToken
      tags: [local]
      summary: Store a pasted fine-grained personal access token
      description: Checked with GET /user before it is stored; `400 invalid` when GitHub rejects it
      parameters:
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], additionalProperties: false, properties: { token: { type: string } } }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/GitHubConnStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/budget-override:
    post:
      operationId: overrideTaskBudget
      tags: [tasks]
      summary: Start a task that waits for a monthly budget anyway
      description: Only a queued task. The task may start runs despite the monthly caps until the calendar month ends; a `budget` event (phase `override`) records it.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - $ref: '#/components/parameters/XRequestedWith'
      responses:
        '200': { description: Allowed; the scheduler picks it up, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/checkpoints:
    get:
      operationId: listTaskCheckpoints
      tags: [tasks]
      summary: The task's checkpoints, oldest first
      description: Empty unless checkpoints were on (GET /settings/checkpoints) while the task ran. `available` is false, with a `reason`, while the task is busy, once its PR is closed, and after WORKSPACE_RETENTION removed the workspace (and the checkpoint refs with it).
      parameters: [{ $ref: '#/components/parameters/TaskID' }]
      responses:
        '200':
          description: Checkpoints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Checkpoint' } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/checkpoints/{checkpointId}:
    get:
      operationId: previewTaskCheckpoint
      tags: [tasks]
      summary: What restoring a checkpoint discards
      description: Counts of what came after the checkpoint and `git diff <checkpoint> HEAD` from the task's host. A checkpoint whose commit is no longer in the workspace comes back with `available` false and a reason.
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: checkpointId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Preview
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointPreview' } } }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/tasks/{id}/checkpoints/{checkpointId}/restore:
    post:
      operationId: restoreTaskCheckpoint
      tags: [tasks]
      summary: Roll the task back to a checkpoint and continue
      description: 'Queues a `restore` run: the scheduler resets the workspace to the checkpoint on the task branch, then the agent continues with `instruction` (empty: "Continue the task from here."). Claude resumes its session at the checkpoint as a fork (`mode` fork); Codex and Cursor start a new session seeded with a summary of the timeline up to the checkpoint (`mode` summary). Records a `checkpoint_restored` event; the later events stay in the timeline. If commits after the checkpoint were already pushed, the next push rewrites the branch with --force-with-lease (only agent/<id> branches) and records `branch_force_pushed`. 409 while the task is busy, after its PR closed, or after WORKSPACE_RETENTION.'
      parameters:
        - $ref: '#/components/parameters/TaskID'
        - { name: checkpointId, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/XRequestedWith'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instruction: { type: string, description: Follow-up for the agent, e.g. "…then do it with a migration instead" }
      responses:
        '200': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/TaskView' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/settings/checkpoints:
    get:
      operationId: getCheckpointSettings
      tags: [settings]
      summary: Whether runners take checkpoints
      description: Off by default. When on, every run commits the working tree to hidden refs after each step that changed files and before each question (docs/PROTOCOL.md, "Checkpoints").
      responses:
        '200':
          description: The setting
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointSettings' } } }
    put:
      operationId: putCheckpointSettings
      tags: [settings]
      summary: Turn checkpoints on or off
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointSettings' } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointSettings' } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/settings/ideas:
    get:
      operationId: getIdeaSettings
      tags: [settings, ideas]
      summary: Whether the Ideas board is on, and its columns
      description: Off by default, with the five default columns (inbox, shaping, ready, in_progress, done).
      responses:
        '200':
          description: The setting
          content: { application/json: { schema: { $ref: '#/components/schemas/IdeaSettings' } } }
    put:
      operationId: putIdeaSettings
      tags: [settings, ideas]
      summary: Turn the board on or off, rename, reorder and add columns
      description: |
        `columns` is the whole list in order (omitted: unchanged). The five default ids must stay
        (rename them instead); new columns are sent without `id`; at most 8 columns. Removing an
        added column with cards (archived ones included) is 409.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IdeaSettingsInput' } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/IdeaSettings' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas:
    get:
      operationId: listIdeas
      tags: [ideas]
      summary: The board (by column and position) or the archive
      description: 'Every card (at most 1000), with attachments and linked tasks. 409 `ideas_disabled` while the board is off.'
      parameters:
        - { name: archived, in: query, schema: { type: boolean }, description: 'true: archived ideas, newest archived first' }
        - { name: project, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 'Searches title, text, transcripts, link titles and URLs, file names' }
      responses:
        '200':
          description: Ideas
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Idea' } }
        '409': { $ref: '#/components/responses/Error' }
    post:
      operationId: createIdea
      tags: [ideas]
      summary: Add an idea at the top of a column (default Inbox)
      description: |
        JSON, or `multipart/form-data` with files in `files[]` (the task attachment rules and limits).
        Without a title, it is the first words of the text, else the first link's title, else the
        first file's name. Links are stored with a preview (page title and og:image thumbnail)
        fetched by the server from public addresses only, within 5 s.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdeaInput' }
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: { type: string }
                body: { type: string }
                project_id: { type: string }
                column: { type: string }
                tags: { type: string, description: Comma-separated }
                links: { type: string, description: One URL per line }
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/voice:
    post:
      operationId: createVoiceIdea
      tags: [ideas]
      summary: A voice note becomes a new idea
      description: |
        The recording (`audio`, its part Content-Type the recorder's: WebM, Ogg, MP4/M4A, AAC, MP3 or WAV;
        at most 40 MB) is stored and transcribed with STT_PROVIDER. The transcript becomes the text and
        its first sentence (at most eight words) the title. With STT off or failing, the note is saved
        without a transcript and titled "Voice note <time>".
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/VoiceUpload' }
      responses:
        '201':
          description: Created
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    get:
      operationId: getIdea
      tags: [ideas]
      summary: One idea
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateIdea
      tags: [ideas]
      summary: Change the title, text, project or tags
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IdeaPatch' } } }
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteIdea
      tags: [ideas]
      summary: Delete an archived idea for good (409 while it is not archived)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '204': { description: Deleted, with its files }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/move:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: moveIdea
      tags: [ideas]
      summary: Move a card to a column, right after another card (or on top)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [column]
              additionalProperties: false
              properties:
                column: { type: string }
                after_id: { type: [integer, 'null'], format: int64, description: 'The card it goes after, in that column; null or omitted: on top' }
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: archiveIdea
      tags: [ideas]
      summary: Archive an idea (off the board)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/unarchive:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: unarchiveIdea
      tags: [ideas]
      summary: Bring an archived idea back to the top of its column
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/attachments:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: addIdeaFiles
      tags: [ideas]
      summary: Add files (images, screenshots, any file) to an idea
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: ['files[]']
              additionalProperties: false
              properties:
                'files[]':
                  type: array
                  maxItems: 10
                  items: { type: string, format: binary }
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/voice:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: addIdeaVoice
      tags: [ideas]
      summary: Add a voice note to an idea; its transcript is appended to the text
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              additionalProperties: false
              properties:
                audio: { type: string, format: binary }
                duration_ms: { type: integer }
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/links:
    parameters: [{ $ref: '#/components/parameters/IdeaID' }]
    post:
      operationId: addIdeaLink
      tags: [ideas]
      summary: Save a link on an idea (with a preview when the page can be fetched)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              additionalProperties: false
              properties:
                url: { type: string, description: 'http(s) only' }
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/ideas/{id}/attachments/{attachmentId}:
    parameters:
      - { $ref: '#/components/parameters/IdeaID' }
      - { name: attachmentId, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      operationId: getIdeaAttachment
      tags: [ideas]
      summary: An idea's file, voice note or thumbnail
      description: 'Images and voice notes are served inline with their type, other files as `application/octet-stream` downloads; `?thumb=1` is the JPEG thumbnail (images and link previews with `has_thumb`).'
      parameters:
        - { name: thumb, in: query, schema: { type: string, enum: ['1'] } }
      responses:
        '200':
          description: The file
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteIdeaAttachment
      tags: [ideas]
      summary: Remove a file, voice note or link from an idea
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: The idea
          content: { application/json: { schema: { $ref: '#/components/schemas/Idea' } } }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/stats:
    get:
      operationId: getStats
      tags: [system]
      summary: Running/queued counts and cost
      responses:
        '200':
          description: Stats
          content:
            application/json:
              schema:
                type: object
                required: [running, queued, waiting_input, cost_usd_today, cost_usd_month, cost_unknown_today, cost_unknown_month]
                properties:
                  running: { type: integer }
                  queued: { type: integer }
                  waiting_input: { type: integer }
                  cost_usd_today: { type: number }
                  cost_usd_month: { type: number }
                  cost_unknown_today: { type: boolean, description: Some of today's runs have no price (cost_usd_today is a lower bound) }
                  cost_unknown_month: { type: boolean, description: Some of this month's runs have no price }

  /api/v1/settings/ci-autofix:
    get:
      operationId: getCIAutoFixDefaults
      tags: [settings]
      summary: Global CI auto-fix default
      description: What projects inherit for the fields their `ci_autofix` leaves null. Missing fields use the built-in defaults (off, 2 attempts, all checks, half the task budget, no CI changes).
      responses:
        '200':
          description: The global default
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIAutoFixSettings' }
    put:
      operationId: putCIAutoFixDefaults
      tags: [settings]
      summary: Replace the global CI auto-fix default
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CIAutoFixSettings' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CIAutoFixSettings' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/settings/costs:
    get:
      operationId: getCostSettings
      tags: [settings]
      summary: Global monthly budget and the price table
      responses:
        '200':
          description: The cost settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostSettings' }
    put:
      operationId: putCostSettings
      tags: [settings]
      summary: Replace the global monthly budget and the price table
      description: '`monthly_budget_usd` null or 0 removes the global cap. `price_table` null restores the built-in table.'
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                monthly_budget_usd: { type: [number, 'null'], minimum: 0 }
                price_table: { oneOf: [{ $ref: '#/components/schemas/PriceTable' }, { type: 'null' }] }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostSettings' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/costs:
    get:
      operationId: getCosts
      tags: [system]
      summary: Cost report and month-to-date budgets
      description: |
        Runs started from `from` through `to` (dates in the server's local time; default: the first of this month to
        today, at most 400 days), summed in total, by project, by agent, by `period` and per day × project × agent
        (`rows`, the CSV export). `budget` and `projects` are always this calendar month.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: period, in: query, schema: { type: string, enum: [day, week, month], default: day } }
      responses:
        '200':
          description: The report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CostReport' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/mcp-servers:
    get:
      operationId: listMCPServers
      tags: [integrations]
      summary: MCP servers of a project, or the global ones
      parameters:
        - name: project
          in: query
          description: Project id; without it, the global servers (that projects can enable)
          schema: { type: string }
      responses:
        '200':
          description: Servers
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MCPServer' } }
    post:
      operationId: createMCPServer
      tags: [integrations]
      summary: Add an MCP server
      description: Needs SECRETS_KEY (503 `secrets_disabled` without it). Secrets are write-only.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServerInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/mcp-servers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      operationId: getMCPServer
      tags: [integrations]
      summary: One MCP server
      responses:
        '200':
          description: Server
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: updateMCPServer
      tags: [integrations]
      summary: Replace an MCP server's settings
      description: Every field is replaced except `secrets`, which merge (a key set to null is removed, keys not sent are kept). `project_id` cannot change.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MCPServerInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPServer' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteMCPServer
      tags: [integrations]
      summary: Delete an MCP server
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/mcp-servers/{id}/test:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    post:
      operationId: testMCPServer
      tags: [integrations]
      summary: Test connection
      description: Connects to the server as the gateway would (a stdio server is started for the test) and lists its tools. A failed connection is `ok:false` with `error`, not an HTTP error.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MCPTestResult' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/integrations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getIntegrations
      tags: [integrations]
      summary: A project's MCP servers and egress policy
      responses:
        '200':
          description: Integrations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      operationId: putIntegrations
      tags: [integrations]
      summary: Set the egress policy and the global servers the project uses
      description: Fields left out are kept. Changes apply from the next run.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                egress: { $ref: '#/components/schemas/Egress' }
                global_server_ids: { type: array, items: { type: integer, format: int64 } }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Integrations' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/projects/{id}/egress/allow:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: allowEgress
      tags: [integrations]
      summary: Allow a blocked host for this project (next run)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
      responses:
        '200':
          description: The project's egress policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Egress' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/mcp-gateway/mcp/{server}:
    post:
      operationId: gatewayMCP
      tags: [gateway]
      summary: MCP gateway (runners only)
      description: |
        Streamable HTTP MCP endpoint of one server for a running task (docs/PROTOCOL.md, "MCP servers"). Authenticated
        only by the run's gateway token (`Authorization: Bearer jmg_…`); no session or CSRF header. 401 for a missing,
        expired or finished run's token; 404 for a server outside the run's scope; 502 when the upstream cannot be reached.
      security: []
      parameters:
        - name: server
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { type: object, description: JSON-RPC message }
      responses:
        '200':
          description: JSON-RPC response
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }

  /api/mcp-gateway/egress/blocked:
    post:
      operationId: gatewayEgressBlocked
      tags: [gateway]
      summary: Egress proxy report of a blocked host
      description: Sent by the egress proxy sidecar with the run's token; recorded once per host and run as an `egress_blocked` event.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [host]
              properties:
                host: { type: string }
      responses:
        '204': { description: Recorded }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: Computers that run tasks next to the server
      responses:
        '200':
          description: Nodes
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Node' } }
    post:
      operationId: createNode
      tags: [nodes]
      summary: Register a computer
      description: Returns the node's token once; the server keeps only its hash.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              additionalProperties: false
              properties:
                id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,31}$', description: Slug; not `server` }
                name: { type: string, description: Defaults to the id }
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [node, token]
                properties:
                  node: { $ref: '#/components/schemas/Node' }
                  token: { type: string, description: 'fpn_<id>.<secret>, shown once' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/nodes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    patch:
      operationId: updateNode
      tags: [nodes]
      summary: Rename a computer or change how many tasks it runs at once
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                max_concurrent: { type: integer, minimum: 1, maximum: 32 }
      responses:
        '200':
          description: Updated
          content: { application/json: { schema: { $ref: '#/components/schemas/Node' } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Remove a computer
      description: 409 while tasks that are not finished run on it.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/nodes/{id}/token:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: rotateNodeToken
      tags: [nodes]
      summary: Issue a new token (the old one stops working)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/nodes/pair:
    post:
      operationId: approvePairing
      tags: [nodes]
      summary: Connect the computer that shows this pairing code
      description: Registers a node for a code from `fleetpocket-node setup` and hands its token to that computer (it collects it with GET /node/pair/{id}).
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              additionalProperties: false
              properties:
                code: { type: string, example: KQ7-4MX, description: Case and dash do not matter }
                name: { type: string, description: Defaults to the computer's name }
      responses:
        '201':
          description: Connected
          content: { application/json: { schema: { $ref: '#/components/schemas/Node' } } }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/nodes/pair/{code}:
    get:
      operationId: lookupPairing
      tags: [nodes]
      summary: The computer waiting with this pairing code
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Waiting computer
          content: { application/json: { schema: { $ref: '#/components/schemas/PendingPairing' } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/node/pair:
    post:
      operationId: startPairing
      tags: [nodes]
      summary: A computer asks for a pairing code (fleetpocket-node setup)
      description: No session. Limited to 5 waiting codes per IP and 20 in total; a code lives 10 minutes and works once.
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                hostname: { type: string }
                platform: { type: string }
                agents: { type: array, items: { $ref: '#/components/schemas/Agent' } }
      responses:
        '201':
          description: Code issued
          content:
            application/json:
              schema:
                type: object
                required: [code, poll_id, expires_in, approve_url]
                properties:
                  code: { type: string, example: KQ7-4MX }
                  poll_id: { type: string, description: Secret the computer polls with }
                  expires_in: { type: integer, description: Seconds }
                  approve_url: { type: string, description: The app's settings page with the code filled in }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/node/pair/{id}:
    get:
      operationId: pollPairing
      tags: [nodes]
      summary: The computer waits for approval
      description: '`pending` until the owner approves; then `approved` with the node token, once. 404 when unknown, expired or already collected.'
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, approved] }
                  node_id: { type: string }
                  name: { type: string }
                  token: { type: string }
                  runner_image: { type: string }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/node/install:
    get:
      operationId: nodeInstallScript
      tags: [nodes]
      summary: 'Install script: curl -fsSL <server>/api/v1/node/install | sh'
      security: []
      responses:
        '200':
          description: POSIX shell script that installs fleetpocket-node and runs its setup
          content: { text/x-shellscript: { schema: { type: string } } }

  /api/v1/node/connect:
    get:
      operationId: connectNode
      tags: [nodes]
      summary: The node's WebSocket (fleetpocket-node only; see docs/design/remote-nodes.md)
      security: []
      parameters:
        - name: Authorization
          in: header
          required: true
          schema: { type: string }
          description: 'Bearer fpn_<id>.<secret>'
      responses:
        '101': { description: Switching protocols }
        '401': { description: Invalid node token }

  /api/v1/signup/start:
    post:
      operationId: signupStart
      tags: [team]
      summary: Open an invite link
      description: Checks the invite and returns a fresh TOTP secret to enrol. Nothing is stored until `POST /signup`.
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              additionalProperties: false
              properties:
                token: { type: string }
      responses:
        '200': { description: Enrol this secret, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/signup:
    post:
      operationId: signup
      tags: [team]
      summary: Create the account from an invite
      description: Needs a code from the enrolled TOTP secret; the invite is used up and a session starts.
      security: []
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, enrollment_id, name, email, password, totp]
              additionalProperties: false
              properties:
                token: { type: string }
                enrollment_id: { type: string }
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 12 }
                totp: { type: string }
      responses:
        '201': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/SessionInfo' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

  /api/v1/team:
    get:
      operationId: getTeam
      tags: [team]
      summary: Team mode status (admin)
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/TeamStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateTeam
      tags: [team]
      summary: Change team settings (admin)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shared_key_fallback: { type: boolean, description: "Allow the server's shared keys as a fallback (default off)" }
      responses:
        '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/TeamStatus' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/team/enable:
    post:
      operationId: enableTeam
      tags: [team]
      summary: Create a team (admin)
      description: The owner becomes user #1 (admin) with the existing password and TOTP; sessions and authorship move to them. Needs SECRETS_KEY.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                name: { type: string }
      responses:
        '200':
          description: Team mode is on
          content:
            application/json:
              schema:
                type: object
                required: [enabled, user]
                properties:
                  enabled: { type: boolean }
                  user: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/team/disable:
    post:
      operationId: disableTeam
      tags: [team]
      summary: Turn team mode off (admin)
      description: Allowed only with one active user left; their credentials become the single owner's.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Off
          content: { application/json: { schema: { type: object, required: [enabled], properties: { enabled: { type: boolean } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [team]
      summary: List users
      description: Admins see everything; members and viewers see names and roles (for the person filter).
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/TeamUser' } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    patch:
      operationId: updateUser
      tags: [team]
      summary: Change a user's role, budget or disable them (admin)
      description: The last active admin and user #1 (the break-glass admin) cannot be demoted or disabled.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                monthly_budget_usd: { type: number, minimum: 0 }
                clear_budget: { type: boolean }
                disabled: { type: boolean }
                live_tasks: { type: string, enum: [finish, cancel], description: "Disabling: what happens to the user's running tasks (default finish)" }
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: '#/components/schemas/TeamUser' }
                  disable: { oneOf: [{ $ref: '#/components/schemas/DisableResult' }, { type: 'null' }] }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: removeUser
      tags: [team]
      summary: Remove a disabled user (admin)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/invites:
    get:
      operationId: listInvites
      tags: [team]
      summary: List invites (admin)
      responses:
        '200':
          description: Invites, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Invite' } }
        '403': { $ref: '#/components/responses/Error' }
    post:
      operationId: createInvite
      tags: [team]
      summary: Create an invite link (admin)
      description: The token is shown once and stored hashed; single use.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              additionalProperties: false
              properties:
                role: { $ref: '#/components/schemas/Role' }
                email: { type: [string, 'null'], description: Only this address may use it }
                expires_in_hours: { type: integer, minimum: 0, description: 'Default 168 (7 days), at most 90 days' }
      responses:
        '201':
          description: The invite and its link
          content:
            application/json:
              schema:
                type: object
                required: [invite, token, url]
                properties:
                  invite: { $ref: '#/components/schemas/Invite' }
                  token: { type: string }
                  url: { type: string }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/invites/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    delete:
      operationId: revokeInvite
      tags: [team]
      summary: Revoke an unused invite (admin)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/audit:
    get:
      operationId: listAudit
      tags: [team]
      summary: Audit log (admin), newest first
      parameters:
        - { name: actor, in: query, schema: { type: integer, format: int64 } }
        - { name: action, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Limit'
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: A page of entries
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
                  next_cursor: { type: string }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/me/totp:
    post:
      operationId: startTotpReset
      tags: [team]
      summary: Start a TOTP reset (team mode)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { description: Enrol this secret, content: { application/json: { schema: { $ref: '#/components/schemas/Enrollment' } } } }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/me/totp/confirm:
    post:
      operationId: confirmTotpReset
      tags: [team]
      summary: Store the new TOTP secret once a code from it works
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_id, password, totp]
              additionalProperties: false
              properties:
                enrollment_id: { type: string }
                password: { type: string }
                totp: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '400': { $ref: '#/components/responses/Error' }

  /api/v1/me/credentials:
    get:
      operationId: listCredentials
      tags: [team]
      summary: My agent keys (team mode)
      description: Values are write-only; only the last 4 characters come back.
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                required: [items, shared_key_fallback]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Credential' } }
                  shared_key_fallback: { type: boolean }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/me/credentials/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/Agent' } }]
    put:
      operationId: putCredential
      tags: [team]
      summary: Add or replace my key for a provider
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, value]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [oauth_token, api_key], description: '`oauth_token` (CLAUDE_CODE_OAUTH_TOKEN) is for claude only' }
                value: { type: string, writeOnly: true }
                label: { type: string }
      responses:
        '200': { description: The key (without its value), content: { application/json: { schema: { $ref: '#/components/schemas/Credential' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: deleteCredential
      tags: [team]
      summary: Remove my key for a provider
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/me/credentials/{provider}/test:
    parameters: [{ name: provider, in: path, required: true, schema: { $ref: '#/components/schemas/Agent' } }]
    post:
      operationId: testCredential
      tags: [team]
      summary: Run the provider's cheapest authenticated check with my key
      description: 'Anthropic and OpenAI: list models; Cursor: API key info. A Claude subscription token is `not_testable`.'
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { description: Result, content: { application/json: { schema: { $ref: '#/components/schemas/KeyTestResult' } } } }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/me/telegram/link:
    post:
      operationId: telegramLinkCode
      tags: [team]
      summary: Get a one-time /link code (10 minutes)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Send `command` to the bot
          content:
            application/json:
              schema:
                type: object
                required: [code, command, expires_at, bot_enabled]
                properties:
                  code: { type: string }
                  command: { type: string, example: /link 123456 }
                  expires_at: { type: string, format: date-time }
                  bot_enabled: { type: boolean }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      operationId: telegramUnlink
      tags: [team]
      summary: Unlink my Telegram account
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { $ref: '#/components/responses/OK' }

  /api/v1/skills/{id}/promote:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
    post:
      operationId: promoteSkill
      tags: [team]
      summary: Make a personal skill a team skill (admin)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200': { description: The skill, content: { application/json: { schema: { $ref: '#/components/schemas/Skill' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/nodes/{id}/shared:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:
      operationId: shareNode
      tags: [team]
      summary: Share a computer with the team (admin)
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared]
              additionalProperties: false
              properties:
                shared: { type: boolean }
      responses:
        '200': { description: The node, content: { application/json: { schema: { $ref: '#/components/schemas/Node' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /api/v1/ws/ticket:
    post:
      operationId: createWebSocketTicket
      tags: [system]
      summary: Single-use ticket to open the WebSocket without a cookie
      description: For sessions that authenticate with a bearer token (Telegram Web). The ticket is valid once, for `expires_in` seconds.
      parameters: [{ $ref: '#/components/parameters/XRequestedWith' }]
      responses:
        '200':
          description: Ticket issued
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket: { type: string }
                  expires_in: { type: integer, description: Seconds }
        '401': { $ref: '#/components/responses/Error' }

  /api/v1/ws:
    get:
      operationId: openWebSocket
      tags: [system]
      summary: WebSocket (see docs/API.md for messages)
      description: Authenticated by the session cookie, or by a `ticket` from `POST /api/v1/ws/ticket`.
      security:
        - session: []
        - {}
      parameters:
        - name: ticket
          in: query
          required: false
          schema: { type: string }
          description: Single-use ticket (instead of the cookie)
      responses:
        '101': { description: Switching protocols }
        '401': { $ref: '#/components/responses/Error' }

  /webhooks/github:
    post:
      operationId: githubWebhook
      tags: [system]
      summary: GitHub webhook (X-Hub-Signature-256)
      security: []
      responses:
        '200': { description: Accepted }
        '401': { description: Bad signature }

  /healthz:
    get:
      operationId: healthz
      tags: [system]
      summary: Database and Docker reachability
      security: []
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Health' }

  /metrics:
    get:
      operationId: metrics
      tags: [system]
      summary: Prometheus metrics (internal network only)
      security: []
      responses:
        '200': { description: Metrics, content: { text/plain: { schema: { type: string } } } }
        '403': { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: fleetpocket_session
    telegramBearer:
      type: http
      scheme: bearer
      description: The `token` from `POST /api/v1/auth/telegram`; accepted only for Telegram sessions.

  parameters:
    XRequestedWith:
      name: X-Requested-With
      in: header
      required: true
      schema: { type: string, enum: [fleetpocket] }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    TaskID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    IdeaID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    OK:
      description: OK
      content:
        application/json:
          schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
    Health:
      description: Health checks
      content:
        application/json:
          schema:
            type: object
            required: [ok, checks]
            properties:
              ok: { type: boolean }
              checks: { type: object, additionalProperties: { type: string } }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            files: { type: array, items: { type: string }, description: '`merge_conflict` only: the files the merge could not combine' }

    SessionInfo:
      type: object
      required: [ok, kind, agents, default_agent, mode, ideas_enabled, team_enabled]
      properties:
        ok: { type: boolean }
        team_enabled: { type: boolean, description: Team mode is on (settings `team`); always false in local mode }
        user: { $ref: '#/components/schemas/Me', description: 'Team mode only: the signed-in user' }
        ideas_enabled: { type: boolean, description: 'The Ideas board is on (settings `ideas`)' }
        kind: { type: string, enum: [web, telegram] }
        mode: { type: string, enum: [server, local], description: '`local`: `npx jungle-monkey` on the owner''s computer (local repositories, optional GitHub)' }
        agents:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
          description: Agents with credentials on the server, which tasks may use
        default_agent: { $ref: '#/components/schemas/Agent' }

    Role:
      type: string
      enum: [admin, member, viewer]

    UserRef:
      type: object
      required: [id, name, initials]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        initials: { type: string, example: AL }

    UserRefOrNull:
      oneOf: [{ $ref: '#/components/schemas/UserRef' }, { type: 'null' }]

    Me:
      type: object
      required: [id, email, name, role, is_owner, github_login, commit_email, telegram_user_id, monthly_budget_usd, task_scope, disabled_at, created_at, last_login_at, initials, telegram_linked]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_owner: { type: boolean, description: 'User #1, the break-glass admin (ADMIN_* credentials)' }
        github_login: { type: [string, 'null'] }
        commit_email: { type: [string, 'null'] }
        telegram_user_id: { type: [integer, 'null'], format: int64 }
        monthly_budget_usd: { type: [number, 'null'] }
        task_scope: { type: [string, 'null'], enum: [mine, everyone, null], description: 'null: by role (admins everyone, others mine)' }
        disabled_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        last_login_at: { type: [string, 'null'], format: date-time }
        initials: { type: string }
        telegram_linked: { type: boolean }

    TeamUser:
      allOf:
        - $ref: '#/components/schemas/Me'
        - type: object
          required: [active]
          properties:
            active: { type: boolean, description: Enrolled and not disabled }

    TeamStatus:
      type: object
      required: [enabled, shared_key_fallback, secrets_key, server_keys]
      properties:
        enabled: { type: boolean }
        shared_key_fallback: { type: boolean }
        secrets_key: { type: boolean, description: SECRETS_KEY is set (team mode needs it) }
        server_keys: { type: array, items: { $ref: '#/components/schemas/Agent' }, description: Agents with an env key on the server }
        active_users: { type: integer }
        active_admins: { type: integer }

    Invite:
      type: object
      required: [id, role, email, created_by, expires_at, used_at, used_by, revoked_at, created_at]
      properties:
        id: { type: integer, format: int64 }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: [string, 'null'] }
        created_by: { type: [integer, 'null'], format: int64 }
        expires_at: { type: string, format: date-time }
        used_at: { type: [string, 'null'], format: date-time }
        used_by: { type: [integer, 'null'], format: int64 }
        revoked_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }

    Enrollment:
      type: object
      required: [enrollment_id, role, email, totp_secret, otpauth_uri]
      properties:
        enrollment_id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: [string, 'null'], description: The invite's email lock }
        totp_secret: { type: string }
        otpauth_uri: { type: string }

    Credential:
      type: object
      required: [provider, kind, last4, label, created_at, last_used_at]
      properties:
        provider: { $ref: '#/components/schemas/Agent' }
        kind: { type: string, enum: [oauth_token, api_key] }
        last4: { type: string, example: …4321 }
        label: { type: string }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }

    KeyTestResult:
      type: object
      required: [status, message]
      properties:
        status: { type: string, enum: [ok, invalid, not_testable, error] }
        message: { type: string }

    DisableResult:
      type: object
      required: [cancelled_tasks, live_tasks]
      properties:
        cancelled_tasks: { type: [array, 'null'], items: { type: integer, format: int64 } }
        live_tasks: { type: [array, 'null'], items: { type: integer, format: int64 } }

    AuditEntry:
      type: object
      required: [id, at, actor_user_id, action, target_type, target_id, meta]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        actor_user_id: { type: [integer, 'null'], format: int64 }
        action: { type: string, example: user.role }
        target_type: { type: string }
        target_id: { type: string }
        meta: { type: object, additionalProperties: true }

    PersonCost:
      type: object
      required: [user_id, name, initials, cost_usd, runs, monthly_budget_usd]
      properties:
        user_id: { type: [integer, 'null'], format: int64 }
        name: { type: string }
        initials: { type: string }
        cost_usd: { type: number }
        runs: { type: integer }
        monthly_budget_usd: { type: [number, 'null'] }

    Agent:
      type: string
      enum: [claude, codex, cursor]
      description: Coding agent that runs a task (Claude Code, OpenAI Codex, Cursor)

    ProjectFields:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        instructions: { type: string }
        services: { type: array, items: { type: string, enum: [postgres, redis] } }
        env: { type: object, additionalProperties: { type: string } }
        runner_image: { type: [string, 'null'] }
        agent:
          type: [string, 'null']
          enum: [claude, codex, cursor, '', null]
          description: Agent for the project's tasks; empty or null uses the server's default_agent
        node: { type: [string, 'null'], description: "Where the project's tasks run: a node id; null, empty or `server` is the server" }
        model: { type: [string, 'null'], description: Model of the project's agent; tasks that override the agent use that agent's default }
        max_turns: { type: [integer, 'null'] }
        max_budget_usd: { type: [number, 'null'] }
        max_duration_sec: { type: [integer, 'null'] }
        runner_memory: { type: [string, 'null'], example: 3g }
        runner_cpus: { type: [number, 'null'] }
        telegram_thread_id: { type: [integer, 'null'], format: int64 }
        archived: { type: boolean }
        ci_autofix:
          $ref: '#/components/schemas/CIAutoFixSettings'
          description: Replaces the project's CI auto-fix overrides as a whole; null fields inherit the global default
        budget:
          $ref: '#/components/schemas/ProjectBudget'
          description: Replaces the project's monthly cap; null or 0 `monthly_usd` removes it
        default_output:
          type: [string, 'null']
          enum: [pr, artifacts, pr_and_artifacts, '', null]
          description: Output new tasks get; empty or null is `pr`. Values other than `pr` are refused with 400 until diagram collection ships
        skills: { type: array, items: { type: string }, description: Replaces the project's enabled skills (slugs; unknown slugs are ignored) }

    CIAutoFixSettings:
      type: object
      additionalProperties: false
      description: CI auto-fix settings (docs/SPEC-server.md "CI auto-fix"). A null field inherits the level below (project → global default → built-in default).
      properties:
        enabled: { type: [boolean, 'null'], description: 'Fix failing CI on PRs Jungle Monkey opened; built-in default false' }
        max_attempts: { type: [integer, 'null'], minimum: 1, maximum: 5, description: Fix attempts per loop; built-in default 2 }
        checks: { type: [array, 'null'], items: { type: string }, description: Check names auto-fix handles; null or empty is all }
        budget_usd: { type: [number, 'null'], minimum: 0, description: Budget of one attempt; null or 0 is half the project's task budget }
        allow_ci_changes: { type: [boolean, 'null'], description: 'Push fixes that touch CI configuration, delete or skip tests, or change coverage thresholds without asking; built-in default false' }

    ProjectBudget:
      type: [object, 'null']
      additionalProperties: false
      description: A project's monthly cap (docs/SPEC-server.md "Costs and budgets"); null is none
      properties:
        monthly_usd: { type: [number, 'null'], minimum: 0 }

    Price:
      type: object
      required: [agent, model, input_usd, output_usd]
      additionalProperties: false
      description: USD per million tokens. The cache rates default to `input_usd` when null.
      properties:
        agent: { $ref: '#/components/schemas/Agent' }
        model: { type: string, description: 'Model name as the run reports it; `*` matches any model of the agent without a row of its own' }
        input_usd: { type: number, minimum: 0 }
        cached_input_usd: { type: [number, 'null'], minimum: 0 }
        cache_write_usd: { type: [number, 'null'], minimum: 0 }
        output_usd: { type: number, minimum: 0 }

    PriceTable:
      type: object
      required: [prices]
      additionalProperties: false
      description: Prices for agents that report tokens but no cost (Codex, Cursor); their runs' costs are estimates.
      properties:
        updated: { type: string, description: 'When the prices were last checked (YYYY-MM-DD)' }
        prices: { type: array, items: { $ref: '#/components/schemas/Price' } }

    CostSettings:
      type: object
      required: [monthly_budget_usd, price_table, price_table_is_default]
      properties:
        monthly_budget_usd: { type: [number, 'null'], description: Global monthly cap; null is none }
        price_table: { $ref: '#/components/schemas/PriceTable' }
        price_table_is_default: { type: boolean, description: The built-in table (never edited) }

    CostSum:
      type: object
      required: [cost_usd, estimated_usd, autofix_usd, api_equivalent_usd, runs, unknown_runs, input_tokens, output_tokens]
      properties:
        cost_usd: { type: number, description: All runs' cost, estimates included }
        estimated_usd: { type: number, description: Part of cost_usd estimated from the price table }
        autofix_usd: { type: number, description: Part of cost_usd spent by CI auto-fix runs }
        api_equivalent_usd: { type: number, description: Part of cost_usd reported for Claude subscription (OAuth) runs, i.e. what the API would charge }
        runs: { type: integer }
        unknown_runs: { type: integer, description: Runs with tokens but no price (cost 0) }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }

    CostReport:
      type: object
      required: [from, to, period, month_start, budget, projects, total, by_project, by_agent, by_period, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        period: { type: string, enum: [day, week, month] }
        month_start: { type: string, format: date }
        budget: { $ref: '#/components/schemas/BudgetStatus' }
        projects:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/BudgetStatus'
              - type: object
                required: [project_id, name]
                properties:
                  project_id: { type: string }
                  name: { type: string }
        total: { $ref: '#/components/schemas/CostSum' }
        by_project: { type: array, items: { $ref: '#/components/schemas/KeyedCostSum' } }
        people:
          type: array
          description: 'Team mode only: cost by person (the task creator of each run) in the range'
          items: { $ref: '#/components/schemas/PersonCost' }
        by_agent: { type: array, items: { $ref: '#/components/schemas/KeyedCostSum' } }
        by_period:
          type: array
          description: Every day, week (from Monday) or month of the range, empty ones included
          items:
            allOf:
              - $ref: '#/components/schemas/CostSum'
              - type: object
                required: [start]
                properties:
                  start: { type: string, format: date }
        rows:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/CostSum'
              - type: object
                required: [day, project_id, agent]
                properties:
                  day: { type: string, format: date }
                  project_id: { type: string }
                  agent: { type: string }

    KeyedCostSum:
      allOf:
        - $ref: '#/components/schemas/CostSum'
        - type: object
          required: [key]
          properties:
            key: { type: string, description: Project id or agent }

    BudgetStatus:
      type: object
      required: [monthly_usd, month_cost_usd, month_cost_unknown]
      properties:
        monthly_usd: { type: [number, 'null'], description: The monthly cap; null is none }
        month_cost_usd: { type: number, description: Cost of runs started this calendar month }
        month_cost_unknown: { type: boolean, description: Some of those runs have no price; month_cost_usd is a lower bound }

    Project:
      type: object
      required: [id, name, instructions, services, env, archived, ci_autofix, budget, month_cost_usd, month_cost_unknown, created_at, updated_at, repositories]
      properties:
        id: { type: string }
        name: { type: string }
        instructions: { type: string }
        services: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        runner_image: { type: [string, 'null'] }
        agent: { type: [string, 'null'], enum: [claude, codex, cursor, null], description: null uses the server's default_agent }
        node: { type: [string, 'null'], description: Node that runs the project's tasks; null is the server }
        model: { type: [string, 'null'] }
        max_turns: { type: [integer, 'null'] }
        max_budget_usd: { type: [number, 'null'] }
        max_duration_sec: { type: [integer, 'null'] }
        runner_memory: { type: [string, 'null'] }
        runner_cpus: { type: [number, 'null'] }
        telegram_thread_id: { type: [integer, 'null'], format: int64 }
        archived: { type: boolean }
        ci_autofix: { $ref: '#/components/schemas/CIAutoFixSettings' }
        budget: { $ref: '#/components/schemas/ProjectBudget' }
        month_cost_usd: { type: number, description: Cost of the project's runs started this calendar month }
        month_cost_unknown: { type: boolean, description: Some of those runs have no price; month_cost_usd is a lower bound }
        default_output: { type: [string, 'null'], enum: [pr, artifacts, pr_and_artifacts, null], description: null is `pr` }
        skills: { type: array, items: { type: string }, description: Slugs of the skills enabled for the project's tasks }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        repositories: { type: array, items: { $ref: '#/components/schemas/Repository' } }

    TaskOutput:
      type: string
      enum: [pr, artifacts, pr_and_artifacts]
      description: '`pr` opens a pull request (default); `artifacts` delivers diagrams only; `pr_and_artifacts` both'

    SkillFile:
      type: object
      required: [path, content]
      additionalProperties: false
      properties:
        path: { type: string, description: 'Relative to the skill folder; no absolute paths, `..`, backslashes or `.git`' }
        content: { type: string, description: Text only }

    SkillInput:
      type: object
      required: [slug, body]
      additionalProperties: false
      properties:
        slug: { type: string, pattern: '^[a-z][a-z0-9-]{1,63}$' }
        body: { type: string, description: 'SKILL.md: YAML frontmatter with `name` and `description`, then markdown' }
        files: { type: array, maxItems: 49, items: { $ref: '#/components/schemas/SkillFile' }, description: 'Extra files; at most 50 files and 1 MB per skill including SKILL.md' }
        enabled_by_default: { type: boolean, description: On for every project's tasks }

    Schedule:
      type: object
      description: 'A recurring task (SPEC-server, "Schedules"). Each firing creates an ordinary task with `source: schedule` and `schedule_id`.'
      required: [id, name, project_id, repository_id, prompt, agent, skills, mcp_servers, cron, timezone, run_budget_usd, monthly_budget_usd, concurrency, pr_only_if_changes, ends_at, loop, enabled, next_run_at, created_at, updated_at, month_spend_usd, busy, last_firing]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        project_id: { type: string }
        repository_id: { type: [integer, 'null'], format: int64, description: "null: the project's default repository" }
        prompt: { type: string }
        agent: { type: [string, 'null'], enum: [claude, codex, cursor, null], description: "null: the project's agent" }
        skills: { type: array, items: { type: string }, description: "Skill slugs added to the project's skills" }
        mcp_servers: { type: [array, 'null'], items: { type: string }, description: "MCP server names (of the project's); null: all of them" }
        cron: { type: string, description: 'Five fields (minute hour day-of-month month day-of-week) or @hourly, @daily, @weekly, @monthly, @yearly; normalised' }
        timezone: { type: string, description: IANA time zone the cron expression is read in }
        run_budget_usd: { type: [number, 'null'], description: "Each run's budget; null: the project's" }
        monthly_budget_usd: { type: [number, 'null'], description: 'Monthly cap of its tasks; null: none' }
        concurrency: { type: string, enum: [skip, queue], description: '`skip`: a firing while a task of the schedule is still running is skipped. `queue`: it waits (at most one) and starts when that task finishes' }
        pr_only_if_changes: { type: boolean, description: 'false: a run without changes makes an empty commit so a PR is opened anyway' }
        ends_at: { type: [string, 'null'], format: date-time, description: No firings after this }
        loop: { $ref: '#/components/schemas/LoopConfigOrNull' }
        enabled: { type: boolean }
        next_run_at: { type: [string, 'null'], format: date-time, description: 'null while paused or after ends_at' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        month_spend_usd: { type: number, description: "Month-to-date cost of its tasks' runs" }
        busy: { type: boolean, description: A task of it has not reached a PR or an end yet }
        last_firing: { oneOf: [{ $ref: '#/components/schemas/ScheduleFiring' }, { type: 'null' }] }
        created_by: { $ref: '#/components/schemas/UserRefOrNull', description: 'Team mode: its creator; its tasks are created as them and use their key' }

    ScheduleInput:
      type: object
      required: [name, project_id, prompt, cron]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        project_id: { type: string }
        repository_id: { type: [integer, 'null'], format: int64 }
        prompt: { type: string, minLength: 1 }
        agent: { type: [string, 'null'], enum: [claude, codex, cursor, null] }
        skills: { type: array, items: { type: string } }
        mcp_servers: { type: [array, 'null'], items: { type: string } }
        cron: { type: string }
        timezone: { type: string, description: Default UTC }
        run_budget_usd: { type: [number, 'null'], minimum: 0 }
        monthly_budget_usd: { type: [number, 'null'], minimum: 0 }
        concurrency: { type: string, enum: [skip, queue], description: Default skip }
        pr_only_if_changes: { type: boolean, description: Default true }
        ends_at: { type: [string, 'null'], format: date-time }
        loop: { oneOf: [{ $ref: '#/components/schemas/LoopInput' }, { type: 'null' }] }
        enabled: { type: boolean, description: Default true }

    ScheduleFiring:
      type: object
      required: [id, schedule_id, scheduled_for, trigger, outcome, reason, task_id, created_at, task_status, task_cost_usd, task_pr_url, loop_state]
      properties:
        id: { type: integer, format: int64 }
        schedule_id: { type: integer, format: int64 }
        scheduled_for: { type: string, format: date-time, description: 'The cron time (manual runs: when asked)' }
        trigger: { type: string, enum: [cron, manual] }
        outcome: { type: string, enum: [started, queued, skipped, missed, failed], description: '`missed`: the server was down for more than one interval at that time' }
        reason: { type: [string, 'null'] }
        task_id: { type: [integer, 'null'], format: int64 }
        created_at: { type: string, format: date-time }
        task_status: { oneOf: [{ $ref: '#/components/schemas/TaskStatus' }, { type: 'null' }] }
        task_cost_usd: { type: [number, 'null'] }
        task_pr_url: { type: [string, 'null'] }
        loop_state: { $ref: '#/components/schemas/LoopState' }

    ScheduleEvent:
      description: The schedule that started this task (`trigger` cron, or manual with `via`).
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [schedule] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [schedule_id, name, trigger, scheduled_for]
              properties:
                schedule_id: { type: integer, format: int64 }
                name: { type: string }
                trigger: { type: string, enum: [cron, manual] }
                scheduled_for: { type: string, format: date-time }
                via: { type: string, enum: [web, telegram] }

    Skill:
      type: object
      required: [id, slug, name, description, body, files, enabled_by_default, created_at, updated_at, projects]
      properties:
        id: { type: integer, format: int64 }
        slug: { type: string }
        name: { type: string, description: From the frontmatter }
        description: { type: string, description: From the frontmatter }
        body: { type: string }
        files: { type: array, items: { $ref: '#/components/schemas/SkillFile' } }
        enabled_by_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        projects: { type: array, items: { type: string }, description: Ids of the projects that enable the skill }
        personal: { type: boolean, description: 'Team mode: visible to its owner (and admins) only, until an admin promotes it' }
        created_by: { $ref: '#/components/schemas/UserRefOrNull' }

    Repository:
      type: object
      required: [id, project_id, full_name, base_branch, installation_id, is_default, source, path, remote_url]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: string }
        full_name: { type: string, description: '"owner/name" on GitHub; the folder name for a local repository' }
        base_branch: { type: string }
        installation_id: { type: integer, format: int64, description: 0 for local repositories }
        is_default: { type: boolean }
        source: { $ref: '#/components/schemas/RepositorySource' }
        path: { type: string, description: 'Absolute work tree of a local repository ("" for GitHub)' }
        remote_url: { type: string, description: 'Origin remote of a local repository, if any (informational; "" otherwise)' }

    LocalRepoSuggestion:
      type: object
      required: [name, path, branch, dirty, last_commit, added]
      properties:
        name: { type: string }
        path: { type: string }
        branch: { type: string, description: '"" on a detached HEAD' }
        dirty: { type: boolean, description: Uncommitted changes to tracked files }
        last_commit: { type: string, format: date-time }
        added: { type: boolean, description: Already a local repository of some project }

    FolderListing:
      type: object
      required: [path, parent, home, is_git, entries]
      properties:
        path: { type: string }
        parent: { type: [string, 'null'], description: null at the home directory }
        home: { type: string }
        is_git: { type: boolean }
        entries:
          type: array
          items:
            type: object
            required: [name, path, is_git]
            properties:
              name: { type: string }
              path: { type: string }
              is_git: { type: boolean }

    LocalRepoAdded:
      type: object
      required: [project, repository, created]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        repository: { $ref: '#/components/schemas/Repository' }
        created: { type: boolean, description: false when the folder was already added }

    LocalRepoStatus:
      type: object
      required: [repository_id, path, missing, branch, detached, dirty]
      properties:
        repository_id: { type: integer, format: int64 }
        path: { type: string }
        missing: { type: boolean, description: 'The folder is gone (moved or deleted): offer "Locate…"' }
        branch: { type: string }
        detached: { type: boolean }
        dirty: { type: boolean }

    GitHubConnStatus:
      type: object
      required: [connected, login, scopes, error, device_flow, gh_cli]
      properties:
        connected: { type: boolean }
        login: { type: string }
        scopes: { type: array, items: { type: string }, description: 'Classic OAuth scopes (X-OAuth-Scopes); empty for a fine-grained token' }
        error: { type: string, description: A stored token that no longer works }
        device_flow: { type: boolean, description: An OAuth App client id is configured }
        gh_cli: { type: boolean, description: The GitHub CLI is installed }

    DeviceCode:
      type: object
      required: [user_code, verification_uri, expires_in, interval]
      properties:
        user_code: { type: string, example: WDJB-MJHT }
        verification_uri: { type: string, example: 'https://github.com/login/device' }
        expires_in: { type: integer }
        interval: { type: integer, description: Seconds between polls }

    RepositorySource:
      type: string
      enum: [github, local]
      description: '`local` (a folder on the owner''s disk) exists only in local mode (`npx jungle-monkey`)'

    BranchName:
      type: string
      maxLength: 200
      pattern: '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'
      description: Plain git branch name; no "..", "//", trailing "/", "." or ".lock"

    GitHubRepo:
      type: object
      required: [full_name, default_branch, private, installation_id]
      properties:
        full_name: { type: string }
        default_branch: { type: string }
        private: { type: boolean }
        installation_id: { type: integer, format: int64 }

    Node:
      type: object
      required: [id, name, max_concurrent, agents, platform, version, last_seen_at, created_at, updated_at, online, active_tasks]
      properties:
        id: { type: string }
        name: { type: string }
        max_concurrent: { type: integer, description: Tasks it runs at once }
        agents:
          type: array
          items: { $ref: '#/components/schemas/Agent' }
          description: Agents with credentials on the node, reported when it connects
        platform: { type: string, example: darwin/arm64 }
        version: { type: string }
        last_seen_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        online: { type: boolean }
        active_tasks: { type: integer, description: Tasks preparing, running, waiting for input or pushing on it }
        created_by: { $ref: '#/components/schemas/UserRefOrNull', description: 'Team mode: the computer''s owner' }
        shared: { type: boolean, description: 'Team mode: an admin shared it, so members'' tasks may run on it' }

    PendingPairing:
      type: object
      required: [code, hostname, platform, agents, ip, expires_at]
      properties:
        code: { type: string }
        hostname: { type: string }
        platform: { type: string }
        agents: { type: array, items: { type: string } }
        ip: { type: string, description: Where the request came from }
        expires_at: { type: string, format: date-time }

    TaskStatus:
      type: string
      enum: [queued, preparing, running, waiting_input, paused, pushing, pr_open, branch_ready, completed, failed, cancelled, needs_key]
      description: '`branch_ready`: a local repository received the task branch (`local_branch`); it mirrors `pr_open`. `needs_key` (team mode): the creator has no key for the task''s agent and the shared-key fallback is off; no runner started. `POST /retry` queues it again once the key is added'

    Task:
      type: object
      required: [id, project_id, repository_id, title, prompt, status, cost_usd_total, turns, source, agent, node, created_at, updated_at, last_activity, last_activity_at, queued_message, autofix_state, autofix_attempts, autofix_max_attempts, autofix_cost_usd, cost_estimated, cost_api_equivalent, cost_unknown, budget_wait, budget_override_at, output, skills, skills_add, skills_remove, schedule_id, mcp_servers, run_budget_usd, loop, loop_state, loop_iteration, local_branch, start_from]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: string }
        repository_id: { type: integer, format: int64 }
        title: { type: string }
        prompt: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        status_reason: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        pr_number: { type: [integer, 'null'] }
        pr_url: { type: [string, 'null'] }
        ci_status: { type: [string, 'null'], enum: [pending, success, failure, null] }
        cost_usd_total: { type: number, description: 'Sum of the runs'' cost: reported by Claude, estimated from the price table for Codex and Cursor (0 when their model has no price)' }
        turns: { type: integer, description: Agent turns across all runs }
        source: { type: string, enum: [web, telegram, api, schedule], description: '`schedule`: fired by the schedule `schedule_id`' }
        agent: { $ref: '#/components/schemas/Agent', description: 'Fixed when the task is created: the request''s agent, else the project''s, else the server default' }
        node: { type: [string, 'null'], description: 'Node the task runs on, fixed when it is created; null is the server' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
        paused_at: { type: [string, 'null'], format: date-time }
        last_activity:
          type: [string, 'null']
          maxLength: 120
          description: 'Latest tool_use summary or status change ("<status>" or "<status>: <reason>"), one line'
        last_activity_at: { type: [string, 'null'], format: date-time }
        output: { $ref: '#/components/schemas/TaskOutput' }
        skills: { type: array, items: { type: string }, description: Skills (slugs) the last run used }
        skills_add: { type: array, items: { type: string } }
        skills_remove: { type: array, items: { type: string } }
        local_branch: { type: [string, 'null'], description: 'Branch delivered into a local repository (`jm/<id>-<slug>`, `-2`… on a name collision); null before delivery and after Discard' }
        start_from: { $ref: '#/components/schemas/StartFrom' }
        queued_message:
          type: [string, 'null']
          description: Text sent while a run was active (several messages joined by a blank line); it becomes the input of the next run when the current one ends. `null` when nothing is queued.
        autofix_state:
          $ref: '#/components/schemas/AutoFixState'
        autofix_attempts: { type: integer, description: CI auto-fix attempts made in the current loop }
        autofix_max_attempts: { type: [integer, 'null'], description: Attempt cap of the current loop }
        autofix_cost_usd: { type: number, description: Part of cost_usd_total spent by CI auto-fix runs }
        cost_estimated: { type: boolean, description: 'Some run''s cost is an estimate: show ≈' }
        cost_api_equivalent: { type: boolean, description: Some run's cost was reported for a Claude subscription (OAuth) login, i.e. what the API would charge }
        cost_unknown: { type: boolean, description: 'Some run has tokens but no price (cost_source unknown): cost_usd_total is a lower bound. Show `$?` (nothing known) or `$0.84+?`' }
        budget_wait:
          type: [string, 'null']
          enum: [global, project, schedule, user, null]
          description: '`user` (team mode): its creator''s monthly budget. Set on a queued task that a monthly cap holds (status_reason "waiting: budget"): the scope whose cap is used up. POST /tasks/{id}/budget-override starts it anyway.'
        budget_override_at: { type: [string, 'null'], format: date-time, description: When the owner let it start despite the monthly caps (good for that calendar month) }
        created_by: { $ref: '#/components/schemas/UserRefOrNull', description: 'Team mode: who created the task (null in single-owner mode)' }
        schedule_id: { type: [integer, 'null'], format: int64, description: The schedule that fired the task (null once the schedule is deleted, or for other tasks) }
        mcp_servers: { type: [array, 'null'], items: { type: string }, description: 'MCP server names the task may use (a subset of its project''s, set by its schedule); null: all of the project''s' }
        run_budget_usd: { type: [number, 'null'], description: 'Budget of each run (set by its schedule); null: the project''s' }
        loop: { $ref: '#/components/schemas/LoopConfigOrNull' }
        loop_state: { $ref: '#/components/schemas/LoopState' }
        loop_iteration: { type: integer, description: The current loop iteration (1-based; 0 without a loop) }

    LoopConfig:
      type: object
      description: 'Loop until a check passes (SPEC-server, "Loops"): after each agent run the runner runs `check_command` in the task container; a non-zero exit starts the next iteration with the trimmed output. The PR is opened only when the loop ends.'
      required: [check_command, max_iterations, budget_usd]
      properties:
        check_command: { type: string, minLength: 1, maxLength: 2000, description: 'e.g. `npm test`, `go test ./...`, `make lint`, or a script that exits 0 when done' }
        max_iterations: { type: integer, minimum: 1, maximum: 10, default: 3 }
        budget_usd: { type: [number, 'null'], minimum: 0, description: 'Cap on the cost of all iterations; null: only the per-run budget' }
        timeout_sec: { type: integer, minimum: 1, maximum: 3600, description: Check command timeout; absent means 600 }

    LoopInput:
      type: object
      description: 'Loop until `check_command` passes. 400 with output `artifacts`.'
      required: [check_command]
      additionalProperties: false
      properties:
        check_command: { type: string, minLength: 1, maxLength: 2000 }
        max_iterations: { type: integer, minimum: 1, maximum: 10, description: Default 3 }
        budget_usd: { type: [number, 'null'], minimum: 0, description: 'Cap on all iterations together; null or 0: none' }
        timeout_sec: { type: integer, minimum: 1, maximum: 3600, description: Default 600 }

    LoopConfigOrNull:
      oneOf:
        - $ref: '#/components/schemas/LoopConfig'
        - type: 'null'

    LoopState:
      type: [string, 'null']
      enum: [running, passed, max_iterations, budget, no_changes, stopped, null]
      description: '`running`, or why the loop ended: the check passed, max_iterations reached, the loop budget used up, two iterations in a row without file changes, or `stopped` (a run limit, a missing check result). null: no loop.'

    StartFrom:
      type: string
      enum: [last_commit, working_tree]
      description: 'Local repositories: start from the last commit (base branch), or from the checked-out commit plus the uncommitted changes and untracked files (committed as "WIP: working tree at start")'

    AutoFixState:
      type: [string, 'null']
      enum: [fixing, held, approved, waiting, green, needs_you, cancelled, null]
      description: |
        CI auto-fix loop: `fixing` (an attempt run is queued or running), `held` (the fix changes CI or tests and waits for the
        owner's answer to the open question), `approved` (pushing it anyway), `waiting` (pushed, waiting for CI), `green`
        (CI passed after a fix), `needs_you` (stopped: attempts used up, same failure twice, budget, a guarded fix discarded),
        `cancelled` (human push, manual follow-up, PR closed). null: no loop.

    TaskView:
      allOf:
        - $ref: '#/components/schemas/Task'
        - type: object
          properties:
            repository: { oneOf: [{ $ref: '#/components/schemas/Repository' }, { type: 'null' }] }
            latest_run: { oneOf: [{ $ref: '#/components/schemas/Run' }, { type: 'null' }] }
            open_question: { oneOf: [{ $ref: '#/components/schemas/Question' }, { type: 'null' }] }

    Run:
      type: object
      required: [id, task_id, kind, input, last_seq, cost_usd, turns, agent, model, input_tokens, output_tokens, cache_read_tokens, cache_write_tokens, cost_source, auth]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        kind: { type: string, enum: [initial, resume, followup, retry, restore, loop], description: '`loop`: a loop iteration after a failed check' }
        input: { type: string }
        container_id: { type: [string, 'null'] }
        exit_code: { type: [integer, 'null'] }
        last_seq: { type: integer, format: int64 }
        cost_usd: { type: number, description: This run's own cost (not the session total) }
        turns: { type: integer, description: Last usage.turns the runner reported for this run }
        autofix_attempt: { type: [integer, 'null'], description: Set on runs CI auto-fix started (the attempt number) }
        loop_iteration: { type: [integer, 'null'], description: The loop iteration the run belongs to (null without a loop) }
        agent: { type: [string, 'null'], description: Agent of the run; null for runs from before it was recorded }
        model: { type: [string, 'null'], description: 'Model the run reported in `started`' }
        input_tokens: { type: integer, format: int64, description: All input, cache reads and writes included }
        output_tokens: { type: integer, format: int64 }
        cache_read_tokens: { type: integer, format: int64 }
        cache_write_tokens: { type: integer, format: int64 }
        cost_source: { $ref: '#/components/schemas/CostSource' }
        auth: { type: [string, 'null'], enum: [api_key, subscription, null], description: 'How the agent was authenticated, when known; `subscription` (Claude OAuth) makes the cost API-equivalent' }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    CostSource:
      type: [string, 'null']
      enum: [reported, estimated, unknown, null]
      description: 'Where cost_usd came from: reported by the agent, estimated from the price table, or unknown (tokens but no price; cost 0). null for runs without usage yet or from before it was recorded.'

    Question:
      type: object
      required: [id, task_id, run_id, text, created_at]
      properties:
        id: { type: string, description: '"<run_id>-<runner question id>"; pass it to /answer' }
        task_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        text: { type: string }
        options: { type: [array, 'null'], items: { type: string } }
        answer: { type: [string, 'null'] }
        answered_via: { type: [string, 'null'], enum: [web, telegram, null] }
        created_at: { type: string, format: date-time }
        answered_at: { type: [string, 'null'], format: date-time }

    Event:
      description: |
        Timeline event, discriminated by `type`. Runner events (PROTOCOL.md)
        have `seq` set and their `payload` is the runner event verbatim
        (including `type`, `ts`, `seq`); backend events have `seq: null`.
      oneOf:
        - $ref: '#/components/schemas/ReadyEvent'
        - $ref: '#/components/schemas/StartedEvent'
        - $ref: '#/components/schemas/AssistantTextEvent'
        - $ref: '#/components/schemas/ToolUseEvent'
        - $ref: '#/components/schemas/ToolResultEvent'
        - $ref: '#/components/schemas/QuestionEvent'
        - $ref: '#/components/schemas/UsageEvent'
        - $ref: '#/components/schemas/CommittedEvent'
        - $ref: '#/components/schemas/DoneEvent'
        - $ref: '#/components/schemas/PausedEvent'
        - $ref: '#/components/schemas/ErrorEvent'
        - $ref: '#/components/schemas/CreatedEvent'
        - $ref: '#/components/schemas/StatusEvent'
        - $ref: '#/components/schemas/AnswerEvent'
        - $ref: '#/components/schemas/MessageEvent'
        - $ref: '#/components/schemas/MessageDroppedEvent'
        - $ref: '#/components/schemas/InterruptEvent'
        - $ref: '#/components/schemas/RunStartedEvent'
        - $ref: '#/components/schemas/RunFinishedEvent'
        - $ref: '#/components/schemas/PrOpenedEvent'
        - $ref: '#/components/schemas/PrUpdatedEvent'
        - $ref: '#/components/schemas/PrClosedEvent'
        - $ref: '#/components/schemas/CiEvent'
        - $ref: '#/components/schemas/DiffRejectedEvent'
        - $ref: '#/components/schemas/AutoFixEvent'
        - $ref: '#/components/schemas/MCPCallEvent'
        - $ref: '#/components/schemas/EgressBlockedEvent'
        - $ref: '#/components/schemas/IntegrationsEvent'
        - $ref: '#/components/schemas/BudgetEvent'
        - $ref: '#/components/schemas/CheckpointEvent'
        - $ref: '#/components/schemas/CheckEvent'
        - $ref: '#/components/schemas/LoopEvent'
        - $ref: '#/components/schemas/ScheduleEvent'
        - $ref: '#/components/schemas/IdeaEvent'
        - $ref: '#/components/schemas/CheckpointRestoredEvent'
        - $ref: '#/components/schemas/BranchForcePushedEvent'
        - $ref: '#/components/schemas/BranchReadyEvent'
        - $ref: '#/components/schemas/BranchActionEvent'
      discriminator:
        propertyName: type
        mapping:
          ready: '#/components/schemas/ReadyEvent'
          started: '#/components/schemas/StartedEvent'
          assistant_text: '#/components/schemas/AssistantTextEvent'
          tool_use: '#/components/schemas/ToolUseEvent'
          tool_result: '#/components/schemas/ToolResultEvent'
          question: '#/components/schemas/QuestionEvent'
          usage: '#/components/schemas/UsageEvent'
          committed: '#/components/schemas/CommittedEvent'
          done: '#/components/schemas/DoneEvent'
          paused: '#/components/schemas/PausedEvent'
          error: '#/components/schemas/ErrorEvent'
          created: '#/components/schemas/CreatedEvent'
          status: '#/components/schemas/StatusEvent'
          answer: '#/components/schemas/AnswerEvent'
          message: '#/components/schemas/MessageEvent'
          message_dropped: '#/components/schemas/MessageDroppedEvent'
          interrupt: '#/components/schemas/InterruptEvent'
          run_started: '#/components/schemas/RunStartedEvent'
          run_finished: '#/components/schemas/RunFinishedEvent'
          pr_opened: '#/components/schemas/PrOpenedEvent'
          pr_updated: '#/components/schemas/PrUpdatedEvent'
          pr_closed: '#/components/schemas/PrClosedEvent'
          ci: '#/components/schemas/CiEvent'
          diff_rejected: '#/components/schemas/DiffRejectedEvent'
          autofix: '#/components/schemas/AutoFixEvent'
          mcp_call: '#/components/schemas/MCPCallEvent'
          egress_blocked: '#/components/schemas/EgressBlockedEvent'
          integrations: '#/components/schemas/IntegrationsEvent'
          budget: '#/components/schemas/BudgetEvent'
          checkpoint: '#/components/schemas/CheckpointEvent'
          check: '#/components/schemas/CheckEvent'
          loop: '#/components/schemas/LoopEvent'
          schedule: '#/components/schemas/ScheduleEvent'
          idea: '#/components/schemas/IdeaEvent'
          checkpoint_restored: '#/components/schemas/CheckpointRestoredEvent'
          branch_force_pushed: '#/components/schemas/BranchForcePushedEvent'
          branch_ready: '#/components/schemas/BranchReadyEvent'
          branch_action: '#/components/schemas/BranchActionEvent'

    EventType:
      type: string
      enum: [ready, started, assistant_text, tool_use, tool_result, question, usage, committed, done, paused, error, created, status, answer, message, message_dropped, interrupt, run_started, run_finished, pr_opened, pr_updated, pr_closed, ci, diff_rejected, autofix, mcp_call, egress_blocked, integrations, budget, checkpoint, check, loop, schedule, checkpoint_restored, branch_force_pushed, branch_ready, branch_action]

    EventBase:
      type: object
      required: [id, task_id, run_id, created_at]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        run_id: { type: [integer, 'null'], format: int64 }
        created_at: { type: string, format: date-time }

    RunnerPayloadBase:
      type: object
      required: [ts, seq]
      properties:
        ts: { type: string, format: date-time }
        seq: { type: integer, format: int64 }

    # ---- runner events ----

    ReadyEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [ready] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ReadyPayload' }

    ReadyPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, runner_version]
          properties:
            type: { type: string, enum: [ready] }
            runner_version: { type: string }

    StartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [started] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/StartedPayload' }

    StartedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, model]
          properties:
            type: { type: string, enum: [started] }
            session_id: { type: string }
            model: { type: string }
            auth: { type: string, enum: [api_key, subscription], description: Claude only; absent when unknown }

    AssistantTextEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [assistant_text] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/AssistantTextPayload' }

    AssistantTextPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, text]
          properties:
            type: { type: string, enum: [assistant_text] }
            text: { type: string }

    ToolUseEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [tool_use] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ToolUsePayload' }

    ToolUsePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, tool, summary]
          properties:
            type: { type: string, enum: [tool_use] }
            tool: { type: string }
            summary: { type: string, description: 'Short, human-readable, e.g. "Edit src/tables/export.ts"' }

    ToolResultEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [tool_result] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ToolResultPayload' }

    ToolResultPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, tool, ok]
          properties:
            type: { type: string, enum: [tool_result] }
            tool: { type: string }
            ok: { type: boolean }
            summary: { type: string, description: Only when ok is false; first line of the error }

    QuestionEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [question] }
            run_id: { type: integer, format: int64 }
            seq: { type: [integer, 'null'], format: int64, description: 'null for the CI auto-fix diff-guard question, which the server asks (question_id `autofix_guard`)' }
            payload: { $ref: '#/components/schemas/QuestionPayload' }

    QuestionPayload:
      allOf:
        - type: object
          properties:
            ts: { type: string, format: date-time }
            seq: { type: integer, format: int64 }
        - type: object
          required: [question_id, text]
          properties:
            type: { type: string, enum: [question] }
            question_id: { type: string, description: 'Runner-local id (q1, q2, …); the API question id is "<run_id>-<question_id>"' }
            text: { type: string }
            options: { type: array, items: { type: string } }

    UsageEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [usage] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/UsagePayload' }

    UsagePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, cost_usd_total, input_tokens, output_tokens, turns]
          properties:
            type: { type: string, enum: [usage] }
            cost_usd_total: { type: number, description: Cumulative for the Claude session }
            input_tokens: { type: integer }
            output_tokens: { type: integer }
            turns: { type: integer, description: Turns in this run }
            cache_read_tokens: { type: integer, description: Part of input_tokens; absent from older runners }
            cache_write_tokens: { type: integer, description: Part of input_tokens; absent from older runners }

    CommittedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [committed] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/CommittedPayload' }

    CheckpointEvent:
      description: The runner committed the working tree to the hidden ref refs/jm/checkpoints/<run_id>/<n> (docs/PROTOCOL.md, "Checkpoints"). Only with checkpoints on (GET /settings/checkpoints).
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [checkpoint] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/CheckpointPayload' }

    CheckpointPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, n, ref_sha, turn, session_ref, files_changed]
          properties:
            type: { type: string, enum: [checkpoint] }
            n: { type: integer, description: 1-based within the run }
            ref_sha: { type: string }
            turn: { type: integer, description: The agent step (tool round) of the run at which it was taken }
            session_ref: { type: string, description: 'What the agent needs to resume at this point; "" when it cannot (Codex, Cursor)' }
            files_changed: { type: integer, description: Files changed since the previous checkpoint of the run (or HEAD) }
            reason: { type: string, enum: [turn, question, iteration], description: '`iteration`: the checkpoint that ends a loop iteration' }

    CheckEvent:
      description: The check command of a loop iteration ran in the runner container after the agent's work was committed (docs/PROTOCOL.md, "Loops"). Exit code 0 passes.
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [check] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/CheckPayload' }

    CheckPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, command, exit_code, output, duration_ms, timed_out]
          properties:
            type: { type: string, enum: [check] }
            command: { type: string }
            exit_code: { type: integer, description: '0 passes; 124 when the timeout killed it' }
            output: { type: string, description: The end of stdout and stderr, trimmed like CI logs (the last 400 lines plus earlier error lines) }
            duration_ms: { type: integer, format: int64 }
            timed_out: { type: boolean }
            iteration: { type: integer, description: The loop iteration (added by the server) }
            max_iterations: { type: integer, description: The loop's max_iterations (added by the server) }

    CommittedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, sha, files_changed, insertions, deletions]
          properties:
            type: { type: string, enum: [committed] }
            sha: { type: string }
            files_changed: { type: integer }
            insertions: { type: integer }
            deletions: { type: integer }

    DoneEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [done] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/DonePayload' }

    DonePayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, summary, no_changes, cost_usd_total]
          properties:
            type: { type: string, enum: [done] }
            session_id: { type: string }
            summary: { type: string }
            no_changes: { type: boolean }
            cost_usd_total: { type: number }

    PausedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [paused] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/PausedPayload' }

    PausedPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, session_id, reason, question_id]
          properties:
            type: { type: string, enum: [paused] }
            session_id: { type: string }
            reason: { type: string, enum: [question_timeout] }
            question_id: { type: string }

    ErrorEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, run_id, seq, payload]
          properties:
            type: { type: string, enum: [error] }
            run_id: { type: integer, format: int64 }
            seq: { type: integer, format: int64 }
            payload: { $ref: '#/components/schemas/ErrorPayload' }

    ErrorPayload:
      allOf:
        - $ref: '#/components/schemas/RunnerPayloadBase'
        - type: object
          required: [type, code, message]
          properties:
            type: { type: string, enum: [error] }
            code: { type: string, description: 'no_auth, bad_command, commit_failed, limit_exceeded, sdk_error or internal' }
            message: { type: string }
            session_id: { type: string }

    # ---- backend events ----

    Attachment:
      type: object
      description: An image or other file attached to a task or a message. Download it with `GET /tasks/{id}/attachments/{id}`.
      required: [id, name, mime, size, width, height]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, description: Original file name }
        mime: { type: string, description: 'image/png, image/jpeg, image/webp or image/gif for images; for other files the type sniffed from the content (e.g. text/plain, application/pdf, application/octet-stream)' }
        size: { type: integer, format: int64, description: Bytes of the stored (cleaned) file }
        width: { type: integer, description: 0 for files that are not images }
        height: { type: integer, description: 0 for files that are not images }

    CreatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [created] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/CreatedPayload' }

    CreatedPayload:
      type: object
      required: [attachments]
      properties:
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: Files attached to the task (may be empty) }

    StatusEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [status] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/StatusPayload' }

    StatusPayload:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        reason: { type: string }

    AnswerEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [answer] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/AnswerPayload' }

    AnswerPayload:
      type: object
      required: [question_id, text, answered_via]
      properties:
        question_id: { type: string, description: API question id ("<run_id>-<runner id>") }
        text: { type: string }
        answered_via: { type: string, enum: [web, telegram] }

    MessageEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [message] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/MessagePayload' }

    MessagePayload:
      type: object
      required: [text, delivery]
      properties:
        text: { type: string }
        delivery:
          type: string
          enum: [queued, new_run, injected]
          description: '`queued`: waits for the active run to end, then starts the next run. `new_run`: started a run right away. `injected`: only in timelines recorded before messages were queued (such text was not delivered reliably).'
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' }, description: Files sent with the message; absent when there are none }

    MessageDroppedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [message_dropped] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/MessageDroppedPayload' }

    MessageDroppedPayload:
      type: object
      required: [text, reason]
      properties:
        text: { type: string, description: The queued text that was not sent }
        reason: { type: string, enum: [failed, cancelled], description: The status that ended the task before the text could start a run }

    InterruptEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [interrupt] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/InterruptPayload' }

    InterruptPayload:
      type: object
      additionalProperties: false
      properties: {}

    RunStartedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [run_started] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/RunStartedPayload' }

    RunStartedPayload:
      type: object
      required: [run_id, kind]
      properties:
        run_id: { type: integer, format: int64 }
        kind: { type: string, enum: [initial, resume, followup, retry, restore] }

    RunFinishedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [run_finished] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/RunFinishedPayload' }

    RunFinishedPayload:
      type: object
      required: [run_id, exit_code]
      properties:
        run_id: { type: integer, format: int64 }
        exit_code: { type: integer, description: Runner exit code (PROTOCOL.md) }
        cost_usd: { type: number, description: "The run's cost (absent before costs were recorded)" }
        cost_source: { type: string, enum: [reported, estimated, unknown] }
        auth: { type: string, enum: [api_key, subscription] }

    BranchReadyEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [branch_ready] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/BranchReadyPayload' }

    BranchReadyPayload:
      type: object
      required: [branch, commits, diffstat, updated]
      properties:
        branch: { type: string, description: 'Branch in the owner''s repository, e.g. jm/42-fix-login' }
        commits: { type: integer, description: Commits on the branch that are not on the base branch }
        diffstat: { type: string, description: '`git diff --stat` summary line against the base branch' }
        updated: { type: boolean, description: 'A follow-up fast-forwarded a branch delivered before' }
        previous: { type: string, description: 'Set when the update went to a new branch because the old one was checked out or had moved' }

    BranchActionEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [branch_action] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/BranchActionPayload' }

    BranchActionPayload:
      type: object
      required: [action, branch]
      properties:
        action: { type: string, enum: [merged, checked_out, discarded, pushed] }
        branch: { type: string }
        into: { type: string, description: 'merged: the owner''s branch it was merged into' }
        fast_forward: { type: boolean, description: 'merged: true when no merge commit was needed' }

    PrOpenedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_opened] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrOpenedPayload' }

    PrOpenedPayload:
      type: object
      required: [number, url]
      properties:
        number: { type: integer }
        url: { type: string }

    PrUpdatedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_updated] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrUpdatedPayload' }

    PrUpdatedPayload:
      type: object
      required: [number, url]
      properties:
        number: { type: integer }
        url: { type: string }

    PrClosedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [pr_closed] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/PrClosedPayload' }

    PrClosedPayload:
      type: object
      required: [number, merged]
      properties:
        number: { type: integer }
        merged: { type: boolean }

    CiEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [ci] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/CiPayload' }

    CiPayload:
      type: object
      required: [status, name, url]
      properties:
        status: { type: string, enum: [pending, success, failure] }
        name: { type: string }
        url: { type: string }

    DiffRejectedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [diff_rejected] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/DiffRejectedPayload' }

    DiffRejectedPayload:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    CheckpointRestoredEvent:
      description: The owner restored a checkpoint. Events after `checkpoint_event_id` up to this one are the abandoned branch (kept, shown greyed).
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [checkpoint_restored] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/CheckpointRestoredPayload' }

    CheckpointRestoredPayload:
      type: object
      required: [checkpoint_id, n, run_id, ref_sha, mode, instruction, via, restore_run_id]
      properties:
        checkpoint_id: { type: integer, format: int64 }
        checkpoint_event_id: { type: integer, format: int64, description: The checkpoint's timeline event (absent once event retention removed it) }
        n: { type: integer }
        run_id: { type: integer, format: int64, description: The run the checkpoint belongs to }
        restore_run_id: { type: integer, format: int64 }
        ref_sha: { type: string }
        mode: { type: string, enum: [fork, summary] }
        instruction: { type: string }
        via: { type: string }

    BranchForcePushedEvent:
      description: A push after a restore rewrote the task branch with --force-with-lease (also commented on the PR and sent to Telegram).
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [branch_force_pushed] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/BranchForcePushedPayload' }

    BranchForcePushedPayload:
      type: object
      required: [branch, from, reason, number]
      properties:
        branch: { type: string }
        from: { type: string, description: The remote commit that was replaced }
        reason: { type: string, enum: [restore] }
        number: { type: integer, description: PR number }

    CheckpointSettings:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    IdeaColumn:
      type: object
      required: [id, name]
      properties:
        id: { type: string, description: 'Stable id: inbox, shaping, ready, in_progress, done, or one the server gave an added column' }
        name: { type: string }

    IdeaSettings:
      type: object
      required: [enabled, columns]
      properties:
        enabled: { type: boolean }
        columns: { type: array, items: { $ref: '#/components/schemas/IdeaColumn' } }

    IdeaSettingsInput:
      type: object
      required: [enabled]
      additionalProperties: false
      properties:
        enabled: { type: boolean }
        columns:
          type: array
          maxItems: 8
          items:
            type: object
            required: [name]
            additionalProperties: false
            properties:
              id: { type: string, description: Omitted for a new column }
              name: { type: string, minLength: 1, maxLength: 40 }

    IdeaAttachment:
      type: object
      required: [id, kind, name, mime, size, width, height, duration_ms, transcript, url, title, has_thumb, created_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, enum: [file, voice, link] }
        name: { type: string, description: 'File name; the host for a link' }
        mime: { type: string, description: 'Images: their type; voice: the recording''s audio type; other files: detected, informational' }
        size: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        duration_ms: { type: [integer, 'null'], description: Voice notes }
        transcript: { type: [string, 'null'], description: 'Voice notes; null without STT or when it failed' }
        url: { type: [string, 'null'], description: Links }
        title: { type: [string, 'null'], description: 'Links: the page title, when it could be fetched' }
        has_thumb: { type: boolean, description: 'A JPEG thumbnail exists (images, link previews)' }
        created_at: { type: string, format: date-time }

    IdeaTask:
      type: object
      required: [id, title, status, pr_url, pr_number]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        pr_url: { type: [string, 'null'] }
        pr_number: { type: [integer, 'null'] }

    Idea:
      type: object
      description: 'A card of the Ideas board (SPEC-server, "Ideas board").'
      required: [id, project_id, title, body, column, position, tags, auto_note, source, archived_at, created_at, updated_at, attachments, voice_notes, linked_task_ids, linked_tasks, failed]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: [string, 'null'] }
        title: { type: string }
        body: { type: string, description: Markdown }
        column: { type: string, description: An IdeaColumn id }
        position: { type: number, format: double, description: 'Order inside the column, ascending' }
        tags: { type: array, items: { type: string } }
        auto_note: { type: [string, 'null'], description: 'Why the card last moved without the owner ("Moved to Done: task #12, PR merged"); cleared by the owner''s next move' }
        source: { type: string, enum: [web, telegram] }
        archived_at: { type: [string, 'null'], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        attachments: { type: array, items: { $ref: '#/components/schemas/IdeaAttachment' }, description: Files and links }
        voice_notes: { type: array, items: { $ref: '#/components/schemas/IdeaAttachment' } }
        linked_task_ids: { type: array, items: { type: integer, format: int64 } }
        linked_tasks: { type: array, items: { $ref: '#/components/schemas/IdeaTask' }, description: Oldest first }
        failed: { type: boolean, description: 'The latest linked task failed (the card''s ✕ stamp)' }
        created_by: { $ref: '#/components/schemas/UserRefOrNull' }

    IdeaInput:
      type: object
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        body: { type: string }
        project_id: { type: [string, 'null'] }
        column: { type: string, description: Default inbox }
        tags: { type: array, items: { type: string } }
        links: { type: array, items: { type: string } }

    IdeaPatch:
      type: object
      additionalProperties: false
      properties:
        title: { type: string }
        body: { type: string }
        project_id: { type: string, description: '"" clears it' }
        tags: { type: array, items: { type: string } }

    VoiceUpload:
      type: object
      required: [audio]
      additionalProperties: false
      properties:
        audio: { type: string, format: binary }
        duration_ms: { type: integer, description: 'Length of the recording (the recorder''s timer), capped at one hour' }
        project_id: { type: string }
        column: { type: string }

    IdeaEvent:
      description: 'An Ideas board card moved because of this task (`started`: linked and moved to In progress; `done`: its PR or local branch merged) or its task failed (`failed`: the card shows ✕).'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [idea] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [idea_id, title, action, column, column_name, moved, reason]
              properties:
                idea_id: { type: integer, format: int64 }
                title: { type: string }
                action: { type: string, enum: [started, done, failed] }
                column: { type: string }
                column_name: { type: string }
                moved: { type: boolean, description: false when the card already was in that column }
                reason: { type: string }

    Checkpoint:
      type: object
      required: [id, task_id, run_id, event_id, n, ref_sha, turn, files_changed, reason, created_at, ref, mode, available]
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        run_id: { type: integer, format: int64 }
        event_id: { type: [integer, 'null'], format: int64, description: Its `checkpoint` timeline event }
        n: { type: integer }
        ref_sha: { type: string }
        turn: { type: integer }
        files_changed: { type: integer }
        reason: { type: string, enum: [turn, question] }
        created_at: { type: string, format: date-time }
        ref: { type: string, description: 'refs/jm/checkpoints/<run_id>/<n> (workspace only, never pushed)' }
        mode: { type: string, enum: [fork, summary] }
        available: { type: boolean }
        unavailable_reason: { type: string, description: Why it cannot be restored now (absent when available) }

    CheckpointPreview:
      allOf:
        - $ref: '#/components/schemas/Checkpoint'
        - type: object
          required: [discarded, diff, truncated]
          properties:
            discarded:
              type: object
              required: [runs, steps, messages, commits]
              properties:
                runs: { type: integer }
                steps: { type: integer }
                messages: { type: integer }
                commits: { type: integer }
            diff: { type: string, description: 'git diff <checkpoint> HEAD: the file changes a restore discards' }
            truncated: { type: boolean }

    MCPServer:
      type: object
      required: [id, project_id, name, kind, transport, url, runtime, package, command, args, secret_hints, tools_mode, tools, read_only, max_calls, enabled, last_used_at, last_status, last_error, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: [string, 'null'], description: null for a global server }
        name: { type: string, description: 'lowercase letters, digits, - and _; the agent sees tools as mcp__<name>__<tool>' }
        kind: { type: string, enum: [remote, stdio, postgres] }
        transport: { type: [string, 'null'], enum: [http, sse, null] }
        url: { type: [string, 'null'] }
        runtime: { type: [string, 'null'], enum: [npm, pip, image, null] }
        package: { type: [string, 'null'], description: npm or pip package, or Docker image }
        command: { type: [string, 'null'], description: 'pip: the executable to run (default: the package name)' }
        args: { type: array, items: { type: string } }
        secret_hints:
          type: object
          additionalProperties: { type: string }
          description: Stored secret keys with their last characters; values are never returned
        tools_mode: { type: string, enum: [all, allow, deny] }
        tools: { type: array, items: { type: string }, description: 'Tool names or patterns (* and ?) for allow/deny' }
        read_only: { type: boolean, description: 'Postgres: enforced (read-only transaction, always rolled back). Other servers: only tools annotated readOnlyHint are exposed.' }
        max_calls: { type: [integer, 'null'], description: Calls per run; null = no limit }
        enabled: { type: boolean }
        last_used_at: { type: [string, 'null'], format: date-time }
        last_status: { type: [string, 'null'], enum: [ok, error, null] }
        last_error: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    MCPServerInput:
      type: object
      required: [name, kind]
      properties:
        project_id: { type: [string, 'null'], description: 'POST only; null or absent: a global server' }
        name: { type: string }
        kind: { type: string, enum: [remote, stdio, postgres] }
        transport: { type: [string, 'null'], enum: [http, sse, null], description: 'remote; default http' }
        url: { type: [string, 'null'] }
        runtime: { type: [string, 'null'], enum: [npm, pip, image, null] }
        package: { type: [string, 'null'] }
        command: { type: [string, 'null'] }
        args: { type: array, items: { type: string } }
        secrets:
          type: object
          additionalProperties: { type: [string, 'null'] }
          description: |
            Write-only. remote: HTTP header names (or `bearer` for `Authorization: Bearer`); stdio: environment variables
            of the sidecar; postgres: `DATABASE_URL`. null removes a key; keys not sent are kept.
        tools_mode: { type: string, enum: [all, allow, deny] }
        tools: { type: array, items: { type: string } }
        read_only: { type: [boolean, 'null'], description: 'default: true for postgres, false otherwise' }
        max_calls: { type: [integer, 'null'] }
        enabled: { type: [boolean, 'null'] }

    MCPTool:
      type: object
      required: [name, description, allowed, read_only]
      properties:
        name: { type: string }
        description: { type: string }
        allowed: { type: boolean, description: The project's settings expose it }
        read_only: { type: boolean }

    MCPTestResult:
      type: object
      required: [ok, tools]
      properties:
        ok: { type: boolean }
        error: { type: string }
        tools: { type: array, items: { $ref: '#/components/schemas/MCPTool' } }

    Egress:
      type: object
      required: [mode, presets, hosts]
      properties:
        mode: { type: string, enum: [open, allowlist], description: 'open: today''s behaviour (default)' }
        presets: { type: array, items: { type: string } }
        hosts: { type: array, items: { type: string }, description: 'host, *.domain (subdomains only) or host:port' }

    EgressPreset:
      type: object
      required: [id, label, hosts]
      properties:
        id: { type: string }
        label: { type: string }
        hosts: { type: array, items: { type: string } }

    AgentMCPSupport:
      type: object
      required: [agent, mcp, proxy, note]
      properties:
        agent: { type: string }
        mcp: { type: boolean }
        proxy: { type: string, enum: ['yes', unverified] }
        note: { type: string }

    Integrations:
      type: object
      required: [secrets_enabled, egress, egress_supported, presets, servers, global_servers, global_server_ids, active, agents, gateway_url]
      properties:
        secrets_enabled: { type: boolean, description: false when SECRETS_KEY is not set (MCP servers cannot be used) }
        egress: { $ref: '#/components/schemas/Egress' }
        egress_supported: { type: boolean, description: false when the project runs on a node (allowlist tasks would not start) }
        presets: { type: array, items: { $ref: '#/components/schemas/EgressPreset' } }
        servers: { type: array, items: { $ref: '#/components/schemas/MCPServer' }, description: The project's own servers }
        global_servers: { type: array, items: { $ref: '#/components/schemas/MCPServer' } }
        global_server_ids: { type: array, items: { type: integer, format: int64 }, description: Global servers this project uses }
        active: { type: array, items: { $ref: '#/components/schemas/MCPServer' }, description: What the next task gets }
        agents: { type: array, items: { $ref: '#/components/schemas/AgentMCPSupport' } }
        gateway_url: { type: string, description: Base URL runners reach the gateway at ("" when unknown) }

    AutoFixEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [autofix] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/AutoFixPayload' }

    AutoFixCheck:
      type: object
      required: [name, url, conclusion]
      properties:
        name: { type: string }
        url: { type: string, description: The check run on GitHub (its logs) }
        conclusion: { type: string }

    AutoFixPayload:
      type: object
      required: [phase]
      description: |
        One automatic CI auto-fix step. `started`: attempt `attempt`/`max_attempts` was queued as run `run_id` with the failing
        `checks`, the failure `signature` and the trimmed logs in `attachments`. `pushed`: the fix was pushed. `held`: the fix
        changes CI or tests (`reasons`); the open question asks the owner. `discarded`: the owner discarded it. `green`: CI passed
        after `fixes` fixes. `needs_you`: the loop stopped (`reason`). `cancelled`: a human push, follow-up or closed PR (`reason`).
      properties:
        phase: { type: string, enum: [started, pushed, held, discarded, green, needs_you, cancelled] }
        attempt: { type: integer }
        max_attempts: { type: integer }
        run_id: { type: integer, format: int64 }
        head_sha: { type: string }
        signature: { type: string }
        checks: { type: array, items: { $ref: '#/components/schemas/AutoFixCheck' } }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        reasons: { type: array, items: { type: string } }
        reason: { type: string }
        fixes: { type: integer }

    MCPCallEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [mcp_call] }
            seq: { type: 'null' }
            payload: { $ref: '#/components/schemas/MCPCallPayload' }

    MCPCallPayload:
      type: object
      required: [server, tool, ok]
      description: One call through the MCP gateway. Sizes and timing only; never arguments, results or credentials. `tool` is "" for a failed connection.
      properties:
        server: { type: string }
        tool: { type: string }
        ok: { type: boolean }
        duration_ms: { type: integer }
        args_bytes: { type: integer }
        result_bytes: { type: integer }
        denied: { type: string, enum: [denied, limit], description: 'denied: the tool is not allowed; limit: max_calls reached' }
        error: { type: string }

    EgressBlockedEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [egress_blocked] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [host]
              properties:
                host: { type: string, description: 'The refused host (once per host and run); POST /projects/{id}/egress/allow allows it' }

    BudgetEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [budget] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [phase]
              description: |
                Monthly budgets: `warning` (this task's run took the scope to 80% this month), `reached` (100%: running runs finish,
                new runs wait), `waiting` (this queued task is held: "waiting: budget"), `override` (the owner let it start anyway,
                `via` web or telegram). Sent once per scope, month and level for warning and reached.
              properties:
                phase: { type: string, enum: [warning, reached, waiting, override] }
                scope: { type: string, enum: [global, project, schedule] }
                project_id: { type: string }
                schedule_id: { type: integer, format: int64, description: 'scope schedule: the schedule whose monthly cap it is' }
                schedule: { type: string, description: 'scope schedule: its name (warning, reached)' }
                level: { type: integer, enum: [80, 100] }
                spent_usd: { type: number }
                limit_usd: { type: number }
                via: { type: string, enum: [web, telegram] }

    LoopEvent:
      description: 'A loop (SPEC-server, "Loops"): `iteration` when an iteration is queued (1 when the task is created or retried; the next one after a failed check, with the check''s `exit_code` and the reason), `stopped` when the loop ended (`state` says why). The PR is opened after `stopped`.'
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [loop] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [phase, iteration]
              properties:
                phase: { type: string, enum: [iteration, stopped] }
                iteration: { type: integer }
                max_iterations: { type: integer }
                check_command: { type: string }
                run_id: { type: integer, format: int64, description: 'iteration: the run of the iteration' }
                exit_code: { type: integer, description: 'iteration > 1: the failed check of the previous one' }
                timed_out: { type: boolean }
                state: { $ref: '#/components/schemas/LoopState' }
                reason: { type: string }
                spent_usd: { type: number, description: What the loop's runs cost so far }

    IntegrationsEvent:
      allOf:
        - $ref: '#/components/schemas/EventBase'
        - type: object
          required: [type, seq, payload]
          properties:
            type: { type: string, enum: [integrations] }
            seq: { type: 'null' }
            payload:
              type: object
              required: [servers, egress]
              description: What the run got, written at its start when it has MCP servers or an allowlist.
              properties:
                servers: { type: array, items: { type: string } }
                egress: { type: string, enum: [open, allowlist] }
                warning: { type: string }
